<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0877ff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="KINGEN WG" />

  <title>KINGEN WG</title>

  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>

  <style>
    :root {
      --blue: #0877ff;
      --blue-dark: #0059d6;
      --blue-light: #eaf4ff;
      --bg: #f4f7fb;
      --card: #ffffff;
      --text: #111827;
      --muted: #718096;
      --border: #e5eaf1;
      --green: #18a957;
      --red: #ef4444;
      --orange: #f59e0b;
      --shadow: 0 10px 30px rgba(20, 45, 90, .08);
      --radius: 22px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background:
        radial-gradient(circle at top left, rgba(8,119,255,.08), transparent 35%),
        var(--bg);
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        Inter,
        Arial,
        sans-serif;
      min-height: 100vh;
      padding-bottom: env(safe-area-inset-bottom);
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
      border: 0;
    }

    .hidden {
      display: none !important;
    }

    /* LOGIN */

    #loginScreen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .login-card {
      width: 100%;
      max-width: 430px;
      background: rgba(255,255,255,.94);
      border: 1px solid rgba(255,255,255,.8);
      box-shadow: 0 25px 70px rgba(0,70,160,.16);
      border-radius: 32px;
      padding: 30px 24px;
      backdrop-filter: blur(20px);
    }

    .logo {
      width: 76px;
      height: 76px;
      border-radius: 24px;
      background: linear-gradient(145deg, #1590ff, #005bd9);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      font-weight: 900;
      margin: 0 auto 18px;
      box-shadow: 0 14px 35px rgba(8,119,255,.28);
    }

    .login-card h1 {
      text-align: center;
      margin: 0;
      font-size: 30px;
      letter-spacing: -1px;
    }

    .login-subtitle {
      text-align: center;
      color: var(--muted);
      margin: 8px 0 26px;
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: #5d6878;
      margin: 0 0 7px 5px;
    }

    .field input,
    .admin-select,
    .text-input {
      width: 100%;
      height: 52px;
      border: 1px solid var(--border);
      background: #f8fafc;
      border-radius: 16px;
      padding: 0 16px;
      outline: none;
      transition: .2s;
    }

    .field input:focus,
    .admin-select:focus,
    .text-input:focus {
      border-color: var(--blue);
      background: white;
      box-shadow: 0 0 0 4px rgba(8,119,255,.1);
    }

    .primary-btn {
      width: 100%;
      height: 54px;
      border-radius: 17px;
      color: white;
      background: linear-gradient(135deg, #168dff, #0062df);
      font-weight: 800;
      box-shadow: 0 12px 25px rgba(8,119,255,.22);
      transition: transform .15s, opacity .15s;
    }

    .primary-btn:active,
    .action-btn:active,
    .nav-btn:active {
      transform: scale(.97);
    }

    .login-error {
      margin-top: 12px;
      color: var(--red);
      text-align: center;
      font-size: 14px;
      font-weight: 700;
    }

    /* APP */

    #app {
      max-width: 760px;
      margin: 0 auto;
      min-height: 100vh;
      padding-bottom: 110px;
    }

    .topbar {
      padding:
        calc(18px + env(safe-area-inset-top))
        18px
        12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand-area {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .mini-logo {
      width: 46px;
      height: 46px;
      border-radius: 15px;
      background: linear-gradient(145deg, #168dff, #005bd9);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: 900;
      box-shadow: 0 9px 22px rgba(8,119,255,.22);
    }

    .brand-title {
      font-size: 19px;
      font-weight: 900;
      letter-spacing: -.4px;
    }

    .brand-subtitle {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }

    .top-actions {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      width: 44px;
      height: 44px;
      border-radius: 15px;
      background: white;
      color: #26364b;
      box-shadow: var(--shadow);
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 19px;
    }

    .icon-badge {
      position: absolute;
      right: -3px;
      top: -4px;
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      border-radius: 10px;
      background: var(--red);
      color: white;
      font-size: 10px;
      font-weight: 900;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .content {
      padding: 0 16px;
    }

    .hero {
      background: linear-gradient(135deg, #0a82ff, #0059d5);
      border-radius: 28px;
      padding: 22px;
      color: white;
      box-shadow: 0 18px 40px rgba(8,119,255,.22);
      margin-bottom: 16px;
      overflow: hidden;
      position: relative;
    }

    .hero::after {
      content: "";
      position: absolute;
      width: 190px;
      height: 190px;
      border-radius: 50%;
      right: -70px;
      top: -70px;
      background: rgba(255,255,255,.09);
    }

    .hero-label {
      font-size: 12px;
      opacity: .8;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .8px;
    }

    .hero-title {
      font-size: 29px;
      font-weight: 900;
      letter-spacing: -1px;
      margin-top: 5px;
      position: relative;
      z-index: 1;
    }

    .hero-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 18px;
      position: relative;
      z-index: 1;
    }

    .hero-user {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .hero-role {
      font-size: 12px;
      opacity: .8;
    }

    .hero-name {
      font-weight: 800;
    }

    .hero-admin {
      background: rgba(255,255,255,.18);
      padding: 8px 11px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 800;
    }

    /* AVATARS */

    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-weight: 900;
      flex: 0 0 auto;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.25);
    }

    .avatar.small {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      font-size: 13px;
    }

    .avatar.large {
      width: 54px;
      height: 54px;
      border-radius: 18px;
      font-size: 18px;
    }

    /* CARDS */

    .section-title {
      font-size: 18px;
      font-weight: 900;
      margin: 23px 3px 10px;
      letter-spacing: -.3px;
    }

    .card {
      background: var(--card);
      border: 1px solid rgba(230,235,242,.9);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 13px;
      overflow: hidden;
    }

    .task-card {
      padding: 18px;
      position: relative;
      touch-action: pan-y;
    }

    .task-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .task-title-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .task-icon {
      width: 48px;
      height: 48px;
      border-radius: 16px;
      background: var(--blue-light);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 24px;
    }

    .task-name {
      font-weight: 900;
      font-size: 17px;
    }

    .task-status {
      color: var(--blue);
      font-size: 12px;
      font-weight: 800;
      margin-top: 3px;
    }

    .task-person {
      margin-top: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      border-radius: 15px;
      background: #f7f9fc;
    }

    .task-person-name {
      font-weight: 800;
      font-size: 14px;
    }

    .task-person-label {
      color: var(--muted);
      font-size: 11px;
    }

    .task-actions {
      display: flex;
      gap: 8px;
      margin-top: 13px;
    }

    .action-btn {
      height: 45px;
      padding: 0 16px;
      border-radius: 14px;
      font-weight: 800;
      transition: .15s;
    }

    .complete-btn {
      background: #eaf9f0;
      color: #168649;
      flex: 1;
    }

    .skip-btn {
      background: #fff2f2;
      color: #dc3434;
      flex: 1;
    }

    .blue-btn {
      background: var(--blue-light);
      color: var(--blue);
    }

    .gray-btn {
      background: #f0f2f5;
      color: #485467;
    }

    /* PEOPLE */

    .people-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .person-mini {
      background: white;
      border-radius: 18px;
      padding: 13px 5px;
      text-align: center;
      border: 1px solid var(--border);
    }

    .person-mini .avatar {
      margin: auto;
    }

    .person-mini-name {
      margin-top: 7px;
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .person-mini-role {
      color: var(--muted);
      font-size: 9px;
      margin-top: 3px;
    }

    /* DUE */

    .due-card {
      border: 1px solid #ffd7d7;
      background: linear-gradient(135deg, #fff, #fff7f7);
      padding: 17px;
    }

    .due-card-inner {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .due-icon {
      width: 48px;
      height: 48px;
      border-radius: 16px;
      background: #ffe6e6;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 23px;
      flex: 0 0 auto;
    }

    .due-main {
      flex: 1;
      min-width: 0;
    }

    .due-title {
      font-weight: 900;
      font-size: 15px;
    }

    .due-person {
      font-size: 12px;
      color: var(--red);
      font-weight: 800;
      margin-top: 3px;
    }

    .due-time {
      color: var(--muted);
      font-size: 11px;
      margin-top: 3px;
    }

    .due-done {
      background: #eaf9f0;
      color: #168649;
      border-radius: 13px;
      padding: 10px 12px;
      font-size: 11px;
      font-weight: 900;
    }

    .empty {
      text-align: center;
      padding: 35px 20px;
      color: var(--muted);
    }

    .empty-icon {
      font-size: 38px;
      margin-bottom: 8px;
    }

    .empty-title {
      color: var(--text);
      font-weight: 900;
      margin-bottom: 4px;
    }

    /* CHAT */

    .chat-tabs {
      display: flex;
      background: #e9eef5;
      padding: 4px;
      border-radius: 15px;
      margin-bottom: 13px;
    }

    .chat-tab {
      flex: 1;
      height: 40px;
      border-radius: 12px;
      background: transparent;
      color: #697588;
      font-weight: 800;
    }

    .chat-tab.active {
      background: white;
      color: var(--blue);
      box-shadow: 0 3px 12px rgba(20,40,80,.08);
    }

    .chat-room-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .chat-room {
      background: white;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 13px;
      display: flex;
      align-items: center;
      gap: 11px;
      text-align: left;
    }

    .chat-room-info {
      flex: 1;
      min-width: 0;
    }

    .chat-room-name {
      font-weight: 850;
      font-size: 14px;
    }

    .chat-room-preview {
      color: var(--muted);
      font-size: 11px;
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .unread {
      min-width: 20px;
      height: 20px;
      border-radius: 10px;
      background: var(--blue);
      color: white;
      font-size: 10px;
      font-weight: 900;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0 6px;
    }

    .chat-header {
      background: white;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .back-btn {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: #f0f4f8;
      font-size: 18px;
    }

    .chat-header-info {
      flex: 1;
    }

    .chat-header-name {
      font-weight: 900;
    }

    .chat-header-status {
      font-size: 10px;
      color: var(--green);
      margin-top: 2px;
    }

    .messages {
      background: #eaf1f8;
      border-radius: 22px;
      padding: 13px;
      min-height: 380px;
      max-height: 58vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .message {
      max-width: 80%;
      padding: 10px 13px;
      border-radius: 17px;
      font-size: 14px;
      line-height: 1.35;
      word-break: break-word;
    }

    .message.mine {
      align-self: flex-end;
      background: var(--blue);
      color: white;
      border-bottom-right-radius: 6px;
    }

    .message.theirs {
      align-self: flex-start;
      background: white;
      color: var(--text);
      border-bottom-left-radius: 6px;
    }

    .message.system {
      align-self: center;
      max-width: 90%;
      background: rgba(255,255,255,.65);
      color: #697588;
      font-size: 11px;
      text-align: center;
    }

    .message-meta {
      font-size: 9px;
      opacity: .65;
      margin-top: 4px;
    }

    .chat-input-row {
      display: flex;
      gap: 8px;
      margin-top: 9px;
    }

    .chat-input {
      flex: 1;
      min-width: 0;
      height: 48px;
      border: 1px solid var(--border);
      border-radius: 15px;
      padding: 0 14px;
      outline: none;
      background: white;
    }

    .send-btn {
      width: 48px;
      height: 48px;
      border-radius: 15px;
      background: var(--blue);
      color: white;
      font-size: 18px;
    }

    /* CALENDAR */

    .calendar-card {
      padding: 15px;
    }

    .calendar-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .calendar-month {
      font-weight: 900;
      font-size: 19px;
    }

    .calendar-arrows {
      display: flex;
      gap: 6px;
    }

    .calendar-arrow {
      width: 37px;
      height: 37px;
      border-radius: 12px;
      background: #f0f4f8;
      font-size: 17px;
    }

    .calendar-weekdays,
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
    }

    .weekday {
      text-align: center;
      color: var(--muted);
      font-size: 9px;
      font-weight: 900;
      padding-bottom: 5px;
    }

    .day {
      min-height: 53px;
      background: #f7f9fc;
      border-radius: 12px;
      padding: 6px;
      position: relative;
      border: 1px solid transparent;
    }

    .day.other-month {
      opacity: .35;
    }

    .day.today {
      border-color: var(--blue);
    }

    .day.selected {
      background: var(--blue-light);
      border-color: #9ccaff;
    }

    .day-number {
      font-size: 11px;
      font-weight: 900;
    }

    .day-dots {
      display: flex;
      gap: 3px;
      margin-top: 6px;
      flex-wrap: wrap;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
    }

    .calendar-details {
      margin-top: 13px;
    }

    .calendar-event {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #f7f9fc;
      border-radius: 15px;
      padding: 11px;
      margin-bottom: 7px;
    }

    .calendar-event-icon {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .calendar-event-main {
      flex: 1;
    }

    .calendar-event-title {
      font-size: 13px;
      font-weight: 900;
    }

    .calendar-event-person {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }

    .calendar-event-time {
      font-size: 10px;
      color: var(--muted);
    }

    /* HISTORY / NOTIFICATIONS */

    .log-item,
    .notice-item {
      display: flex;
      gap: 11px;
      padding: 14px;
      background: white;
      border-bottom: 1px solid var(--border);
    }

    .log-item:first-child,
    .notice-item:first-child {
      border-radius: 18px 18px 0 0;
    }

    .log-item:last-child,
    .notice-item:last-child {
      border-radius: 0 0 18px 18px;
      border-bottom: 0;
    }

    .log-icon {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: #edf4ff;
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
    }

    .log-main,
    .notice-main {
      flex: 1;
    }

    .log-text,
    .notice-text {
      font-size: 13px;
      font-weight: 700;
      line-height: 1.35;
    }

    .log-time,
    .notice-time {
      color: var(--muted);
      font-size: 10px;
      margin-top: 4px;
    }

    /* ADMIN */

    .admin-card {
      padding: 17px;
    }

    .admin-title {
      font-weight: 900;
      font-size: 17px;
      margin-bottom: 4px;
    }

    .admin-description {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
      margin-bottom: 15px;
    }

    .order-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .order-row {
      display: flex;
      align-items: center;
      gap: 9px;
      background: #f7f9fc;
      border-radius: 15px;
      padding: 10px;
    }

    .order-number {
      width: 25px;
      height: 25px;
      border-radius: 9px;
      background: white;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 11px;
      font-weight: 900;
      color: var(--blue);
    }

    .order-row .avatar {
      width: 35px;
      height: 35px;
      border-radius: 11px;
      font-size: 11px;
    }

    .order-name {
      flex: 1;
      font-weight: 800;
      font-size: 13px;
    }

    .order-controls {
      display: flex;
      gap: 4px;
    }

    .order-control {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: white;
      color: #536174;
    }

    .settings-row {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }

    .settings-row:last-child {
      border-bottom: 0;
    }

    .settings-row-icon {
      width: 40px;
      height: 40px;
      border-radius: 13px;
      background: #edf4ff;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .settings-row-main {
      flex: 1;
    }

    .settings-row-title {
      font-weight: 800;
      font-size: 13px;
    }

    .settings-row-sub {
      color: var(--muted);
      font-size: 10px;
      margin-top: 2px;
    }

    /* PROFILE */

    .profile-card {
      padding: 19px;
    }

    .profile-header {
      display: flex;
      align-items: center;
      gap: 13px;
      margin-bottom: 17px;
    }

    .profile-name {
      font-size: 19px;
      font-weight: 900;
    }

    .profile-role {
      color: var(--muted);
      font-size: 11px;
      margin-top: 3px;
    }

    /* NAV */

    .bottom-nav {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 0;
      width: min(760px, 100%);
      padding:
        8px
        9px
        calc(8px + env(safe-area-inset-bottom));
      background: rgba(255,255,255,.91);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border-top: 1px solid rgba(220,225,232,.8);
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      z-index: 100;
    }

    .nav-btn {
      height: 57px;
      background: transparent;
      color: #8490a1;
      border-radius: 17px;
      position: relative;
      transition: .15s;
    }

    .nav-btn.active {
      color: var(--blue);
      background: #edf5ff;
    }

    .nav-icon {
      font-size: 19px;
      display: block;
      line-height: 20px;
    }

    .nav-label {
      display: block;
      font-size: 9px;
      font-weight: 800;
      margin-top: 4px;
    }

    .nav-badge {
      position: absolute;
      top: 4px;
      right: 23%;
      min-width: 17px;
      height: 17px;
      border-radius: 9px;
      background: var(--red);
      color: white;
      font-size: 9px;
      font-weight: 900;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0 4px;
    }

    /* TOAST */

    #toast {
      position: fixed;
      left: 50%;
      bottom: calc(84px + env(safe-area-inset-bottom));
      transform: translate(-50%, 15px);
      background: rgba(20,28,40,.94);
      color: white;
      padding: 12px 17px;
      border-radius: 15px;
      font-size: 12px;
      font-weight: 800;
      z-index: 500;
      opacity: 0;
      pointer-events: none;
      transition: .25s;
      max-width: calc(100% - 40px);
      text-align: center;
    }

    #toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    /* MODAL */

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(5,20,45,.38);
      backdrop-filter: blur(5px);
      z-index: 300;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .modal {
      width: min(760px, 100%);
      max-height: 88vh;
      overflow-y: auto;
      background: white;
      border-radius: 28px 28px 0 0;
      padding: 19px 18px calc(20px + env(safe-area-inset-bottom));
      animation: slideUp .23s ease;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .modal-handle {
      width: 40px;
      height: 5px;
      background: #dce1e8;
      border-radius: 4px;
      margin: 0 auto 17px;
    }

    .modal-title {
      font-size: 21px;
      font-weight: 900;
      margin-bottom: 15px;
    }

    /* RESPONSIVE */

    @media (max-width: 420px) {
      .people-row {
        grid-template-columns: repeat(4, 1fr);
      }

      .task-actions .action-btn {
        padding: 0 9px;
        font-size: 12px;
      }

      .day {
        min-height: 48px;
      }
    }
  </style>
</head>

<body>

  <!-- LOGIN -->
  <div id="loginScreen">
    <div class="login-card">
      <div class="logo">KW</div>
      <h1>KINGEN WG</h1>
      <div class="login-subtitle">Deine WG. Deine Aufgaben. Alles an einem Ort.</div>

      <div class="field">
        <label>Dein Name</label>
        <input
          id="loginName"
          type="text"
          placeholder="z.B. Hassan"
          autocomplete="name"
        />
      </div>

      <div class="field">
        <label>WG Code</label>
        <input
          id="loginCode"
          type="password"
          placeholder="••••"
          inputmode="numeric"
        />
      </div>

      <button class="primary-btn" onclick="login()">
        Einloggen
      </button>

      <div id="loginError" class="login-error hidden"></div>
    </div>
  </div>

  <!-- APP -->
  <div id="app" class="hidden">

    <header class="topbar">
      <div class="brand-area">
        <div class="mini-logo">KW</div>
        <div>
          <div class="brand-title">KINGEN WG</div>
          <div class="brand-subtitle" id="topSubtitle">Gemeinsam organisiert</div>
        </div>
      </div>

      <div class="top-actions">
        <button class="icon-btn" onclick="setTab('notifications')" aria-label="Notifications">
          🔔
          <span id="notificationBadge" class="icon-badge hidden">0</span>
        </button>

        <button class="icon-btn" onclick="setTab('profile')" aria-label="Profile">
          👤
        </button>
      </div>
    </header>

    <main id="content" class="content"></main>

    <nav class="bottom-nav">
      <button id="nav-home" class="nav-btn" onclick="setTab('home')">
        <span class="nav-icon">🏠</span>
        <span class="nav-label">Home</span>
      </button>

      <button id="nav-due" class="nav-btn" onclick="setTab('due')">
        <span class="nav-icon">🔴</span>
        <span class="nav-label">Fällig</span>
        <span id="dueBadge" class="nav-badge hidden">0</span>
      </button>

      <button id="nav-chat" class="nav-btn" onclick="setTab('chat')">
        <span class="nav-icon">💬</span>
        <span class="nav-label">Chat</span>
        <span id="chatBadge" class="nav-badge hidden">0</span>
      </button>

      <button id="nav-calendar" class="nav-btn" onclick="setTab('calendar')">
        <span class="nav-icon">📅</span>
        <span class="nav-label">Kalender</span>
      </button>

      <button id="nav-history" class="nav-btn" onclick="setTab('history')">
        <span class="nav-icon">📋</span>
        <span class="nav-label">Verlauf</span>
      </button>
    </nav>
  </div>

  <div id="toast"></div>

  <div id="modalRoot"></div>

  <script type="module">

    /* =========================================================
       FIREBASE
    ========================================================= */

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

    import {
      getDatabase,
      ref,
      onValue,
      set
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAv-1UXuNTEU8aFb8VfpFFVYg6VR1nkQVM",
      authDomain: "kingenwg.firebaseapp.com",
      databaseURL: "https://kingenwg-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "kingenwg",
      storageBucket: "kingenwg.firebasestorage.app",
      messagingSenderId: "959662859826",
      appId: "1:959662859826:web:b44260e9944545fa58fe2b"
    };

    const firebaseApp = initializeApp(firebaseConfig);
    const db = getDatabase(firebaseApp);

    const DB_PATH = "wg_secure_v6";
    const WG_CODE = "1234";

    const ONESIGNAL_APP_ID = "ccca5ec6-33c7-4921-a67a-d3b06de45512";

    /* =========================================================
       CONSTANTS
    ========================================================= */

    const COLORS = [
      "#0877ff",
      "#8b5cf6",
      "#10a36b",
      "#f59e0b",
      "#ef4444",
      "#06b6d4"
    ];

    const TASK_LABELS = {
      trash: "Müll",
      clean: "Putzen"
    };

    const TASK_ICONS = {
      trash: "🗑️",
      clean: "🧹",
      extra: "➕"
    };

    const WEEKDAYS = [
      "So",
      "Mo",
      "Di",
      "Mi",
      "Do",
      "Fr",
      "Sa"
    ];

    const MONTHS = [
      "Januar",
      "Februar",
      "März",
      "April",
      "Mai",
      "Juni",
      "Juli",
      "August",
      "September",
      "Oktober",
      "November",
      "Dezember"
    ];

    /* =========================================================
       STATE
    ========================================================= */

    function defaultUsers() {
      return [
        {
          id: 0,
          name: "Jacky",
          deviceId: "",
          colorId: 0,
          isAdmin: false
        },
        {
          id: 1,
          name: "Hassan",
          deviceId: "",
          colorId: 1,
          isAdmin: true
        },
        {
          id: 2,
          name: "Suraj",
          deviceId: "",
          colorId: 2,
          isAdmin: false
        },
        {
          id: 3,
          name: "Andreas",
          deviceId: "",
          colorId: 3,
          isAdmin: false
        }
      ];
    }

    let S = {
      trashOrder: [0, 1, 2, 3],
      cleanOrder: [1, 2, 3, 0],

      trashIndex: 0,
      cleanIndex: 0,

      globalLog: [],
      users: defaultUsers(),

      groupChat: [],
      privateChats: {},

      dueTasks: [],
      completedTasks: [],

      extraTasks: [],

      tab: "home",
      chatSubTab: "group",
      activePrivatePartner: null,

      calendarDate: new Date(
        new Date().getFullYear(),
        new Date().getMonth(),
        1
      ),

      selectedCalendarDate: new Date(),

      isLoggedIn: false,
      mySlot: 0,

      initialized: false
    };

    /* =========================================================
       HELPERS
    ========================================================= */

    function esc(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function userById(id) {
      return S.users.find(u => Number(u.id) === Number(id)) || null;
    }

    function userName(id) {
      return userById(id)?.name || "Unbekannt";
    }

    function userColor(user) {
      if (!user) return COLORS[0];

      const colorId = Number.isFinite(Number(user.colorId))
        ? Number(user.colorId)
        : Number(user.id) || 0;

      return COLORS[Math.abs(colorId) % COLORS.length];
    }

    function initials(name) {
      const n = String(name || "?").trim();

      if (!n) return "?";

      const parts = n.split(/\s+/);

      if (parts.length >= 2) {
        return (
          parts[0][0] +
          parts[parts.length - 1][0]
        ).toUpperCase();
      }

      return n.substring(0, 2).toUpperCase();
    }

    function avatarHTML(user, size = "") {
      if (!user) {
        return `<div class="avatar ${size}">?</div>`;
      }

      return `
        <div
          class="avatar ${size}"
          style="background:${userColor(user)}"
        >
          ${esc(initials(user.name))}
        </div>
      `;
    }

    function now() {
      return Date.now();
    }

    function formatTime(timestamp) {
      if (!timestamp) return "";

      return new Date(timestamp).toLocaleTimeString("de-DE", {
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function formatDate(timestamp) {
      if (!timestamp) return "";

      return new Date(timestamp).toLocaleDateString("de-DE", {
        day: "2-digit",
        month: "2-digit",
        year: "numeric"
      });
    }

    function formatDateShort(timestamp) {
      if (!timestamp) return "";

      return new Date(timestamp).toLocaleDateString("de-DE", {
        day: "2-digit",
        month: "2-digit"
      });
    }

    function sameDate(a, b) {
      const da = new Date(a);
      const dbb = new Date(b);

      return (
        da.getFullYear() === dbb.getFullYear() &&
        da.getMonth() === dbb.getMonth() &&
        da.getDate() === dbb.getDate()
      );
    }

    function dateKey(date) {
      const d = new Date(date);

      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");

      return `${y}-${m}-${day}`;
    }

    function showToast(message) {
      const toast = document.getElementById("toast");

      toast.textContent = message;
      toast.classList.add("show");

      clearTimeout(window.__toastTimer);

      window.__toastTimer = setTimeout(() => {
        toast.classList.remove("show");
      }, 2600);
    }

    function getMyUser() {
      return userById(S.mySlot) || S.users[0];
    }

    function isAdmin() {
      return !!getMyUser()?.isAdmin;
    }

    function currentTurn(type) {
      const order = type === "trash"
        ? S.trashOrder
        : S.cleanOrder;

      const index = type === "trash"
        ? S.trashIndex
        : S.cleanIndex;

      return order[index] ?? S.users[0]?.id ?? 0;
    }

    function nextIndex(type, index) {
      const order = type === "trash"
        ? S.trashOrder
        : S.cleanOrder;

      if (!order.length) return 0;

      return (index + 1) % order.length;
    }

    function normaliseUsers(users) {
      if (!Array.isArray(users) || !users.length) {
        return defaultUsers();
      }

      return users.map((u, i) => ({
        id: Number.isFinite(Number(u.id)) ? Number(u.id) : i,
        name: String(u.name || `User ${i + 1}`),
        deviceId: String(u.deviceId || ""),
        colorId: Number.isFinite(Number(u.colorId))
          ? Number(u.colorId)
          : i,
        isAdmin: !!u.isAdmin || String(u.name || "").toLowerCase() === "hassan"
      }));
    }

    /* =========================================================
       LOCAL STORAGE
    ========================================================= */

    function setLoggedIn(slot) {
      localStorage.setItem("wg_logged_in", "1");
      localStorage.setItem("wg_user_slot", String(slot));
    }

    function clearLoggedIn() {
      localStorage.removeItem("wg_logged_in");
      localStorage.removeItem("wg_user_slot");
    }

    function loadLocalLogin() {
      const logged = localStorage.getItem("wg_logged_in");
      const slot = Number(localStorage.getItem("wg_user_slot"));

      if (
        logged === "1" &&
        Number.isInteger(slot) &&
        slot >= 0
      ) {
        S.isLoggedIn = true;
        S.mySlot = slot;
      }
    }

    function groupReadKey() {
      return `wg_group_read_${S.mySlot}`;
    }

    function privateReadKey(partnerId) {
      return `wg_private_read_${S.mySlot}_${partnerId}`;
    }

    function getUnreadGroup() {
      const last = Number(localStorage.getItem(groupReadKey()) || 0);

      return S.groupChat.filter(msg =>
        Number(msg.sender) !== Number(S.mySlot) &&
        Number(msg.time || 0) > last
      ).length;
    }

    function getUnreadPrivate(partnerId) {
      const last = Number(
        localStorage.getItem(privateReadKey(partnerId)) || 0
      );

      const key = privateChatKey(S.mySlot, partnerId);

      return (S.privateChats[key] || []).filter(msg =>
        Number(msg.sender) !== Number(S.mySlot) &&
        Number(msg.time || 0) > last
      ).length;
    }

    function markGroupRead() {
      localStorage.setItem(
        groupReadKey(),
        String(Date.now())
      );
    }

    function markPrivateRead(partnerId) {
      localStorage.setItem(
        privateReadKey(partnerId),
        String(Date.now())
      );
    }

    /* =========================================================
       FIREBASE SAVE
    ========================================================= */

    async function saveToCloud() {
      try {
        await set(ref(db, DB_PATH), {
          trashOrder: S.trashOrder,
          cleanOrder: S.cleanOrder,

          trashIndex: S.trashIndex,
          cleanIndex: S.cleanIndex,

          globalLog: S.globalLog.slice(-300),

          users: S.users,

          groupChat: S.groupChat.slice(-300),

          privateChats: S.privateChats,

          dueTasks: S.dueTasks,

          completedTasks: S.completedTasks.slice(-500),

          extraTasks: S.extraTasks.slice(-200)
        });
      } catch (error) {
        console.error("Firebase save failed:", error);
        showToast("Speichern fehlgeschlagen");
      }
    }

    /* =========================================================
       FIREBASE LOAD
    ========================================================= */

    onValue(ref(db, DB_PATH), snapshot => {

      const data = snapshot.val();

      if (data) {

        S.trashOrder = Array.isArray(data.trashOrder)
          ? data.trashOrder.map(Number)
          : [0, 1, 2, 3];

        S.cleanOrder = Array.isArray(data.cleanOrder)
          ? data.cleanOrder.map(Number)
          : [1, 2, 3, 0];

        S.trashIndex = Number(data.trashIndex || 0);
        S.cleanIndex = Number(data.cleanIndex || 0);

        S.globalLog = Array.isArray(data.globalLog)
          ? data.globalLog
          : [];

        S.users = normaliseUsers(data.users);

        S.groupChat = Array.isArray(data.groupChat)
          ? data.groupChat
          : [];

        S.privateChats =
          data.privateChats &&
          typeof data.privateChats === "object"
            ? data.privateChats
            : {};

        S.dueTasks = Array.isArray(data.dueTasks)
          ? data.dueTasks
          : [];

        S.completedTasks = Array.isArray(data.completedTasks)
          ? data.completedTasks
          : [];

        S.extraTasks = Array.isArray(data.extraTasks)
          ? data.extraTasks
          : [];

        /*
          Migration:
          Her -> Andreas
          Hassan -> Admin
        */

        let changed = false;

        S.users.forEach(user => {

          if (
            String(user.name).trim().toLowerCase() === "her"
          ) {
            user.name = "Andreas";
            changed = true;
          }

          if (
            String(user.name).trim().toLowerCase() === "hassan"
            && !user.isAdmin
          ) {
            user.isAdmin = true;
            changed = true;
          }
        });

        if (changed) {
          setTimeout(saveToCloud, 200);
        }
      }

      /*
        If there is no database yet, create our initial structure.
      */

      if (!data && !S.initialized) {
        S.initialized = true;
        saveToCloud();
      }

      S.initialized = true;

      if (S.mySlot >= S.users.length) {
        S.mySlot = 0;
      }

      updateLoginVisibility();
      render();

    }, error => {
      console.error("Firebase listener error:", error);
      showToast("Firebase Verbindung fehlgeschlagen");
    });

    /* =========================================================
       ONESIGNAL
    ========================================================= */

    window.OneSignalDeferred =
      window.OneSignalDeferred || [];

    window.OneSignalDeferred.push(
      async function(OneSignal) {

        try {

          await OneSignal.init({
            appId: ONESIGNAL_APP_ID,
            notifyButton: {
              enable: false
            }
          });

          if (S.isLoggedIn) {
            await OneSignal.login(`user_${S.mySlot}`);
          }

        } catch (error) {
          console.warn(
            "OneSignal could not initialize:",
            error
          );
        }
      }
    );

    async function sendPushToUser(
      userId,
      title,
      message
    ) {

      try {

        const response = await fetch(
          "/api/send-push",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              userId: `user_${userId}`,
              title,
              message
            })
          }
        );

        if (!response.ok) {
          throw new Error(
            `Push endpoint returned ${response.status}`
          );
        }

      } catch (error) {

        /*
          The Vercel page still works if /api/send-push
          hasn't been created yet.

          We deliberately don't expose the OneSignal REST API
          key inside this HTML file.
        */

        console.warn(
          "Push could not be sent:",
          error.message
        );
      }
    }

    /* =========================================================
       LOGIN / LOGOUT
    ========================================================= */

    function updateLoginVisibility() {

      const login = document.getElementById("loginScreen");
      const app = document.getElementById("app");

      if (S.isLoggedIn) {
        login.classList.add("hidden");
        app.classList.remove("hidden");
      } else {
        login.classList.remove("hidden");
        app.classList.add("hidden");
      }
    }

    window.login = async function() {

      const nameInput =
        document.getElementById("loginName");

      const codeInput =
        document.getElementById("loginCode");

      const error =
        document.getElementById("loginError");

      const name =
        String(nameInput.value || "").trim();

      const code =
        String(codeInput.value || "").trim();

      error.classList.add("hidden");

      if (!name || !code) {
        error.textContent =
          "Bitte Name und WG Code eingeben.";
        error.classList.remove("hidden");
        return;
      }

      if (code !== WG_CODE) {
        error.textContent =
          "Der WG Code ist falsch.";
        error.classList.remove("hidden");
        return;
      }

      const existing =
        S.users.find(
          u =>
            String(u.name).trim().toLowerCase() ===
            name.toLowerCase()
        );

      if (existing) {

        S.mySlot = Number(existing.id);

      } else {

        /*
          Allow a new name to be assigned to an unused
          slot for the project/demo.
        */

        const free =
          S.users.find(
            u =>
              !u.name ||
              /^User \d+$/i.test(u.name)
          );

        if (free) {
          free.name = name;
          S.mySlot = free.id;
        } else {
          error.textContent =
            "Name nicht gefunden. Verwende einen WG Namen.";
          error.classList.remove("hidden");
          return;
        }
      }

      S.isLoggedIn = true;

      setLoggedIn(S.mySlot);

      try {

        window.OneSignalDeferred =
          window.OneSignalDeferred || [];

        window.OneSignalDeferred.push(
          async function(OneSignal) {

            try {
              await OneSignal.login(
                `user_${S.mySlot}`
              );
            } catch (e) {
              console.warn(e);
            }

          }
        );

      } catch (e) {}

      await saveToCloud();

      updateLoginVisibility();
      render();

      showToast(
        `Willkommen, ${userName(S.mySlot)} 👋`
      );
    };

    window.logout = async function() {

      try {

        window.OneSignalDeferred =
          window.OneSignalDeferred || [];

        window.OneSignalDeferred.push(
          async function(OneSignal) {

            try {
              await OneSignal.logout();
            } catch (e) {
              console.warn(e);
            }

          }
        );

      } catch (e) {}

      S.isLoggedIn = false;
      S.activePrivatePartner = null;

      clearLoggedIn();

      document.getElementById("loginName").value = "";
      document.getElementById("loginCode").value = "";

      updateLoginVisibility();
      render();

      showToast("Du wurdest ausgeloggt.");
    };

    window.switchUser = function() {

      S.isLoggedIn = false;
      S.activePrivatePartner = null;

      clearLoggedIn();

      updateLoginVisibility();

      document.getElementById("loginName").focus();

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    };

    /* =========================================================
       NAVIGATION
    ========================================================= */

    window.setTab = function(tab) {

      S.tab = tab;

      if (tab === "chat" && S.chatSubTab === "group") {
        markGroupRead();
      }

      render();
    };

    window.setChatSubTab = function(tab) {

      S.chatSubTab = tab;
      S.activePrivatePartner = null;

      if (tab === "group") {
        markGroupRead();
      }

      render();
    };

    window.openPrivateWith = function(id) {

      S.activePrivatePartner = Number(id);

      markPrivateRead(Number(id));

      render();

      setTimeout(() => {

        const box =
          document.getElementById("messages");

        if (box) {
          box.scrollTop = box.scrollHeight;
        }

      }, 40);
    };

    window.backToPrivateList = function() {

      S.activePrivatePartner = null;
      S.chatSubTab = "private";

      render();
    };

    /* =========================================================
       TURN ACTIONS
    ========================================================= */

    window.skipTurn = function(type) {

      if (!isAdmin() && false) {
        return;
      }

      const order =
        type === "trash"
          ? S.trashOrder
          : S.cleanOrder;

      const index =
        type === "trash"
          ? S.trashIndex
          : S.cleanIndex;

      if (!order.length) return;

      const skippedId = order[index];

      if (!S.dueTasks) {
        S.dueTasks = [];
      }

      const alreadyDue =
        S.dueTasks.some(
          due =>
            Number(due.user) === Number(skippedId) &&
            due.type === type
        );

      if (!alreadyDue) {

        S.dueTasks.push({
          id: `${type}_${skippedId}_${Date.now()}`,
          user: skippedId,
          type,
          createdAt: Date.now()
        });

      }

      const oldUser =
        userById(skippedId);

      if (type === "trash") {
        S.trashIndex =
          nextIndex("trash", S.trashIndex);
      } else {
        S.cleanIndex =
          nextIndex("clean", S.cleanIndex);
      }

      const nextUserId =
        currentTurn(type);

      const label =
        TASK_LABELS[type];

      S.globalLog.push({
        id: Date.now(),
        type: "skip",
        task: type,
        user: skippedId,
        text:
          `${oldUser?.name || "Jemand"} hat ${label} übersprungen.`,
        time: Date.now()
      });

      S.groupChat.push({
        id: Date.now() + 1,
        sender: -1,
        system: true,
        text:
          `${oldUser?.name || "Jemand"} hat ${label} übersprungen. ` +
          `${userName(nextUserId)} ist jetzt dran.`,
        time: Date.now()
      });

      saveToCloud();

      sendPushToUser(
        nextUserId,
        "Du bist jetzt dran!",
        `${userName(skippedId)} hat ${label} übersprungen.`
      );

      render();

      showToast(
        `${userName(skippedId)} hat jetzt eine Fälligkeit.`
      );
    };

    window.confirmTask = function(type) {

      const order =
        type === "trash"
          ? S.trashOrder
          : S.cleanOrder;

      const index =
        type === "trash"
          ? S.trashIndex
          : S.cleanIndex;

      const userId =
        order[index];

      const taskLabel =
        TASK_LABELS[type];

      /*
        Remove matching Due task.
      */

      S.dueTasks =
        (S.dueTasks || []).filter(
          due =>
            !(
              Number(due.user) === Number(userId) &&
              due.type === type
            )
        );

      /*
        Save completion for Calendar.
      */

      S.completedTasks.push({
        id: Date.now(),
        type,
        user: userId,
        time: Date.now()
      });

      S.globalLog.push({
        id: Date.now() + 1,
        type: "complete",
        task: type,
        user: userId,
        text:
          `${userName(userId)} hat ${taskLabel} erledigt.`,
        time: Date.now()
      });

      S.groupChat.push({
        id: Date.now() + 2,
        sender: -1,
        system: true,
        text:
          `${userName(userId)} hat ${taskLabel} erledigt. ✅`,
        time: Date.now()
      });

      if (type === "trash") {
        S.trashIndex =
          nextIndex("trash", S.trashIndex);
      } else {
        S.cleanIndex =
          nextIndex("clean", S.cleanIndex);
      }

      saveToCloud();

      const nextUserId =
        currentTurn(type);

      sendPushToUser(
        nextUserId,
        `${taskLabel} 🏠`,
        `Du bist jetzt dran mit ${taskLabel}.`
      );

      render();

      showToast(
        `${taskLabel} erledigt! ✅`

    function privateChatKey(a, b) {

      const x = Math.min(
        Number(a),
        Number(b)
      );

      const y = Math.max(
        Number(a),
        Number(b)
      );

      return `${x}_${y}`;
    }

    window.sendGroupMessage = function() {

      const input =
        document.getElementById("groupMessage");

      if (!input) return;

      const text =
        String(input.value || "").trim();

      if (!text) return;

      S.groupChat.push({
        id: Date.now(),
        sender: S.mySlot,
        text,
        time: Date.now()
      });

      saveToCloud();

      input.value = "";

      markGroupRead();

      render();

      setTimeout(() => {

        const box =
          document.getElementById("messages");

        if (box) {
          box.scrollTop = box.scrollHeight;
        }

      }, 30);
    };

    window.sendPrivateMessage = function() {

      const partner =
        S.activePrivatePartner;

      if (
        partner === null ||
        partner === undefined
      ) {
        return;
      }

      const input =
        document.getElementById("privateMessage");

      if (!input) return;

      const text =
        String(input.value || "").trim();

      if (!text) return;

      const key =
        privateChatKey(
          S.mySlot,
          partner
        );

      if (!Array.isArray(S.privateChats[key])) {
        S.privateChats[key] = [];
      }

      S.privateChats[key].push({
        id: Date.now(),
        sender: S.mySlot,
        receiver: partner,
        text,
        time: Date.now()
      });

      saveToCloud();

      input.value = "";

      markPrivateRead(partner);

      render();

      setTimeout(() => {

        const box =
          document.getElementById("messages");

        if (box) {
          box.scrollTop = box.scrollHeight;
        }

      }, 30);
    };

    window.moveOrder = function(
      type,
      index,
      direction
    ) {

      if (!isAdmin()) {
        showToast("Nur Hassan kann die Reihenfolge ändern.");
        return;
      }

      const order =
        type === "trash"
          ? S.trashOrder
          : S.cleanOrder;

      const target =
        index + direction;

      if (
        target < 0 ||
        target >= order.length
      ) {
        return;
      }

      [
        order[index],
        order[target]
      ] = [
        order[target],
        order[index]
      ];

      if (type === "trash") {
        S.trashIndex = 0;
      } else {
        S.cleanIndex = 0;
      }

      saveToCloud();

      renderAdminModal();

      render();
    };

      if (!isAdmin()) return;

      if (type === "trash") {
        S.trashIndex = 0;

        S.cleanIndex = 0;

      S.globalLog.push({
        id: Date.now(),
        type: "admin",

        time: Date.now()

      renderAdminModal();
      render();

      showToast("Rotation zurückgesetzt.");

        </div>
      `;
    }

    /* =========================================================
       DUE PAGE
    ========================================================= */

    function renderDue() {

      const due =
        [...(S.dueTasks || [])]
          .sort(
            (a, b) =>
              Number(b.createdAt || 0) -
              Number(a.createdAt || 0)
          );

      return `

        <div class="section-title">
          Fällige Aufgaben
        </div>

        <div style="color:var(--muted);font-size:12px;margin:0 4px 14px;">
          Übersprungene Aufgaben bleiben hier, bis sie erledigt werden.
        </div>

        ${
          due.length
            ? `
              ${due.map((item, index) => {

                const user =
                  userById(item.user);

                const label =
                  TASK_LABELS[item.type] ||
                  "Aufgabe";

                return `
                  <div class="card due-card">

                    <div class="due-card-inner">

                      <div class="due-icon">
                        ${TASK_ICONS[item.type] || "🔴"}
                      </div>

                      <div class="due-main">

                        <div class="due-title">
                          ${esc(label)}
                        </div>

                        <div class="due-person">
                          ${esc(user?.name || "Unbekannt")}
                        </div>

                        <div class="due-time">
                          Übersprungen am
                          ${formatDate(item.createdAt)}
                          ·
                          ${formatTime(item.createdAt)}
                        </div>

                      </div>

                      <button
                        class="due-done"
                        onclick="clearDue(${index})"
                      >
                        ERLEDIGT
                      </button>

                    </div>

                  </div>
                `;

              }).join("")}
            `
            : `
              <div class="card">
                <div class="empty">

                  <div class="empty-icon">
                    🎉
                  </div>

                  <div class="empty-title">
                    Keine fälligen Aufgaben
                  </div>

                  <div>
                    Alles ist erledigt.
                  </div>

                </div>
              </div>
            `
        }

      `;
    }

    /* =========================================================
       CHAT
    ========================================================= */

    function renderChat() {

      if (
        S.chatSubTab === "private" &&
        S.activePrivatePartner !== null
      ) {
        return renderPrivateChat();
      }

      return `

        <div class="section-title">
          Chat
        </div>

        <div class="chat-tabs">

          <button
            class="chat-tab ${
              S.chatSubTab === "group"
                ? "active"
                : ""
            }"
            onclick="setChatSubTab('group')"
          >
            👥 Gruppe
          </button>

          <button
            class="chat-tab ${
              S.chatSubTab === "private"
                ? "active"
                : ""
            }"
            onclick="setChatSubTab('private')"
          >
            👤 Privat
          </button>

        </div>

        ${
          S.chatSubTab === "group"
            ? renderGroupChat()
            : renderPrivateList()
        }

      `;
    }

    function renderGroupChat() {

      const messages =
        S.groupChat || [];

      return `

        <div class="messages" id="messages">

          ${
            messages.length
              ? messages.map(renderMessage).join("")
              : `
                <div class="empty">
                  <div class="empty-icon">💬</div>
                  <div class="empty-title">
                    Noch keine Nachrichten
                  </div>
                  <div>
                    Starte den WG Chat.
                  </div>
                </div>
              `
          }

        </div>

        <div class="chat-input-row">

          <input
            id="groupMessage"
            class="chat-input"
            placeholder="Nachricht..."
            onkeydown="if(event.key==='Enter') sendGroupMessage()"
          />

          <button
            class="send-btn"
            onclick="sendGroupMessage()"
          >
            ↑
          </button>

        </div>
      `;
    }

    function renderMessage(msg) {

      if (msg.system) {

        return `
          <div class="message system">
            ${esc(msg.text)}
            <div class="message-meta">
              ${formatTime(msg.time)}
            </div>
          </div>
        `;
      }

      const mine =
        Number(msg.sender) ===
        Number(S.mySlot);

      return `
        <div class="message ${mine ? "mine" : "theirs"}">

          ${
            !mine
              ? `
                <div style="font-size:10px;font-weight:900;margin-bottom:3px;">
                  ${esc(userName(msg.sender))}
                </div>
              `
              : ""
          }

          ${esc(msg.text)}

          <div class="message-meta">
            ${formatTime(msg.time)}
          </div>

        </div>
      `;
    }

    function renderPrivateList() {

      const people =
        S.users.filter(
          u =>
            Number(u.id) !==
            Number(S.mySlot)
        );

      return `

        <div class="chat-room-list">

          ${
            people.map(user => {

              const unread =
                getUnreadPrivate(user.id);

              const key =
                privateChatKey(
                  S.mySlot,
                  user.id
                );

              const chats =
                S.privateChats[key] || [];

              const last =
                chats[chats.length - 1];

              return `
                <button
                  class="chat-room"
                  onclick="openPrivateWith(${user.id})"
                >

                  ${avatarHTML(user)}

                  <div class="chat-room-info">

                    <div class="chat-room-name">
                      ${esc(user.name)}
                    </div>

                    <div class="chat-room-preview">
                      ${
                        last
                          ? esc(last.text)
                          : "Noch keine Nachrichten"
                      }
                    </div>

                  </div>

                  ${
                    unread
                      ? `<div class="unread">${unread}</div>`
                      : ""
                  }

                </button>
              `;

            }).join("")
          }

        </div>
      `;
    }

    function renderPrivateChat() {

      const partner =
        userById(
          S.activePrivatePartner
        );

      if (!partner) {
        S.activePrivatePartner = null;
        return renderPrivateList();
      }

      const key =
        privateChatKey(
          S.mySlot,
          partner.id
        );

      const messages =
        S.privateChats[key] || [];

      return `

        <div class="chat-header">

          <button
            class="back-btn"
            onclick="backToPrivateList()"
          >
            ‹
          </button>

          ${avatarHTML(partner, "small")}

          <div class="chat-header-info">

            <div class="chat-header-name">
              ${esc(partner.name)}
            </div>

            <div class="chat-header-status">
              ● WG Mitglied
            </div>

          </div>

        </div>

        <div class="messages" id="messages">

          ${
            messages.length
              ? messages.map(msg => renderMessage({
                  ...msg,
                  system: false
                })).join("")
              : `
                <div class="empty">
                  <div class="empty-icon">👋</div>
                  <div class="empty-title">
                    Keine Nachrichten
                  </div>
                  <div>
                    Schreib ${esc(partner.name)} etwas.
                  </div>
                </div>
              `
          }

        </div>

        <div class="chat-input-row">

          <input
            id="privateMessage"
            class="chat-input"
            placeholder="Nachricht an ${esc(partner.name)}..."
            onkeydown="if(event.key==='Enter') sendPrivateMessage()"
          />

          <button
            class="send-btn"
            onclick="sendPrivateMessage()"
          >
            ↑
          </button>

        </div>
      `;
    }

    /* =========================================================
       CALENDAR
    ========================================================= */

    function renderCalendar() {

      const year =
        S.calendarDate.getFullYear();

      const month =
        S.calendarDate.getMonth();

      const firstDay =
        new Date(
          year,
          month,
          1
        ).getDay();

      const daysInMonth =
        new Date(
          year,
          month + 1,
          0
        ).getDate();

      const previousMonthDays =
        new Date(
          year,
          month,
          0
        ).getDate();

      let cells = [];

      /*
        Previous month.
      */

      for (
        let i = firstDay - 1;
        i >= 0;
        i--
      ) {

        const day =
          previousMonthDays - i;

        cells.push({
          day,
          monthOffset: -1
        });
      }

      /*
        Current month.
      */

      for (
        let day = 1;
        day <= daysInMonth;
        day++
      ) {

        cells.push({
          day,
          monthOffset: 0
        });
      }

      /*
        Next month.
      */

      while (cells.length % 7 !== 0) {

        cells.push({
          day:
            cells.length -
            (firstDay + daysInMonth) +
            1,
          monthOffset: 1
        });
      }

      const selected =
        S.selectedCalendarDate;

      const selectedEvents =
        completedForDate(selected);

      return `

        <div class="section-title">
          Kalender
        </div>

        <div class="card calendar-card">

          <div class="calendar-head">

            <div class="calendar-month">
              ${MONTHS[month]} ${year}
            </div>

            <div class="calendar-arrows">

              <button
                class="calendar-arrow"
                onclick="changeCalendarMonth(-1)"
              >
                ‹
              </button>

              <button
                class="calendar-arrow"
                onclick="changeCalendarMonth(1)"
              >
                ›
              </button>

            </div>

          </div>

          <div class="calendar-weekdays">

            ${WEEKDAYS.map(day => `
              <div class="weekday">
                ${day}
              </div>
            `).join("")}

          </div>

          <div class="calendar-grid">

            ${cells.map(cell => {

              const cellDate =
                new Date(
                  year,
                  month + cell.monthOffset,
                  cell.day
                );

              const selectedClass =
                sameDate(
                  cellDate,
                  selected
                )
                  ? "selected"
                  : "";

              const todayClass =
                sameDate(
                  cellDate,
                  new Date()
                )
                  ? "today"
                  : "";

              const otherClass =
                cell.monthOffset !== 0
                  ? "other-month"
                  : "";

              const events =
                completedForDate(
                  cellDate
                );

              return `

                <button
                  class="day ${selectedClass} ${todayClass} ${otherClass}"
                  onclick="selectCalendarDate('${dateKey(cellDate)}')"
                >

                  <div class="day-number">
                    ${cell.day}
                  </div>

                  ${
                    events.length
                      ? `
                        <div class="day-dots">

                          ${events.slice(0, 4).map(event => {

                            const u =
                              userById(event.user);

                            return `
                              <span
                                class="dot"
                                style="background:${userColor(u)}"
                              ></span>
                            `;

                          }).join("")}

                        </div>
                      `
                      : ""
                  }

                </button>

              `;

            }).join("")}

          </div>

          <div class="calendar-details">

            <div style="font-weight:900;margin:13px 3px 9px;">
              ${
                selected.toLocaleDateString(
                  "de-DE",
                  {
                    weekday: "long",
                    day: "numeric",
                    month: "long"
                  }
                )
              }
            </div>

            ${
              selectedEvents.length
                ? selectedEvents.map(event => {

                    const user =
                      userById(event.user);

                    const icon =
                      TASK_ICONS[event.type] ||
                      "➕";

                    const title =
                      event.type === "extra"
                        ? "Extra Aufgabe"
                        : TASK_LABELS[event.type];

                    return `
                      <div class="calendar-event">

                        <div class="calendar-event-icon">
                          ${icon}
                        </div>

                        <div class="calendar-event-main">

                          <div class="calendar-event-title">
                            ${esc(title)}
                          </div>

                          <div class="calendar-event-person">
                            ${esc(user?.name || "Unbekannt")}
                            ${event.text
                              ? ` · ${esc(event.text)}`
                              : ""}
                          </div>

                        </div>

                        <div class="calendar-event-time">
                          ${formatTime(event.time)}
                        </div>

                      </div>
                    `;

                  }).join("")
                : `
                  <div class="empty" style="padding:20px;">
                    <div class="empty-icon">
                      📅
                    </div>

                    <div class="empty-title">
                      Keine erledigten Aufgaben
                    </div>

                    <div>
                      Für diesen Tag gibt es noch keinen Eintrag.
                    </div>
                  </div>
                `
            }

          </div>

        </div>

      `;
    }

    /* =========================================================
       HISTORY
    ========================================================= */

    function renderHistory() {

      const logs =
        [...(S.globalLog || [])]
          .sort(
            (a, b) =>
              Number(b.time || 0) -
              Number(a.time || 0)
          );

      return `

        <div class="section-title">
          Verlauf
        </div>

        <div class="card">

          ${
            logs.length
              ? logs.map(log => {

                  let icon = "📋";

                  if (log.type === "complete") {
                    icon = "✅";
                  }

                  if (log.type === "skip") {
                    icon = "⏭️";
                  }

                  if (log.type === "due_complete") {
                    icon = "🔴";
                  }

                  if (log.type === "extra") {
                    icon = "➕";
                  }

                  if (log.type === "extra_complete") {
                    icon = "☑️";
                  }

                  if (log.type === "admin") {
                    icon = "👑";
                  }

                  return `
                    <div class="log-item">

                      <div class="log-icon">
                        ${icon}
                      </div>

                      <div class="log-main">

                        <div class="log-text">
                          ${esc(log.text || "")}
                        </div>

                        <div class="log-time">
                          ${formatDate(log.time)}
                          ·
                          ${formatTime(log.time)}
                        </div>

                      </div>

                    </div>
                  `;

                }).join("")
              : `
                <div class="empty">
                  <div class="empty-icon">📋</div>
                  <div class="empty-title">
                    Noch kein Verlauf
                  </div>
                  <div>
                    Aktionen erscheinen hier.
                  </div>
                </div>
              `
          }

        </div>
      `;
    }

    /* =========================================================
       NOTIFICATIONS
    ========================================================= */

    function renderNotifications() {

      const notices = [];

      /*
        Due notifications.
      */

      (S.dueTasks || []).forEach(due => {

        notices.push({
          icon: "🔴",
          text:
            `${userName(due.user)} hat eine fällige Aufgabe: ` +
            `${TASK_LABELS[due.type] || "Aufgabe"}`,
          time: due.createdAt
        });

      });

      /*
        Recent logs.
      */

      [...(S.globalLog || [])]
        .sort(
          (a, b) =>
            Number(b.time || 0) -
            Number(a.time || 0)
        )
        .slice(0, 15)
        .forEach(log => {

          let icon = "📋";

          if (log.type === "complete") {
            icon = "✅";
          }

          if (log.type === "skip") {
            icon = "⏭️";
          }

          if (log.type === "due_complete") {
            icon = "🔴";
          }

          notices.push({
            icon,
            text: log.text,
            time: log.time
          });

        });

      notices.sort(
        (a, b) =>
          Number(b.time || 0) -
          Number(a.time || 0)
      );

      return `

        <div class="section-title">
          🔔 Benachrichtigungen
        </div>

        <div class="card">

          ${
            notices.length
              ? notices.slice(0, 30).map(item => `
                  <div class="notice-item">

                    <div class="log-icon">
                      ${item.icon}
                    </div>

                    <div class="notice-main">

                      <div class="notice-text">
                        ${esc(item.text)}
                      </div>

                      <div class="notice-time">
                        ${formatDate(item.time)}
                        ·
                        ${formatTime(item.time)}
                      </div>

                    </div>

                  </div>
                `).join("")
              : `
                <div class="empty">
                  <div class="empty-icon">🔔</div>
                  <div class="empty-title">
                    Keine Benachrichtigungen
                  </div>
                  <div>
                    Alles ruhig.
                  </div>
                </div>
              `
          }

        </div>

      `;
    }

    /* =========================================================
       PROFILE
    ========================================================= */

    function renderProfile() {

      const me =
        getMyUser();

      return `

        <div class="section-title">
          Profil
        </div>

        <div class="card profile-card">

          <div class="profile-header">

            ${avatarHTML(me, "large")}

            <div>

              <div class="profile-name">
                ${esc(me?.name || "")}
              </div>

              <div class="profile-role">
                ${
                  me?.isAdmin
                    ? "👑 WG Administrator"
                    : "WG Mitglied"
                }
              </div>

            </div>

          </div>

          ${
            me?.isAdmin
              ? `
                <button
                  class="action-btn blue-btn"
                  onclick="openAdmin()"
                  style="width:100%;margin-bottom:8px;"
                >
                  👑 Admin Einstellungen
                </button>
              `
              : ""
          }

          <button
            class="action-btn gray-btn"
            onclick="switchUser()"
            style="width:100%;margin-bottom:8px;"
          >
            🔄 Benutzer wechseln
          </button>

          <button
            class="action-btn skip-btn"
            onclick="logout()"
            style="width:100%;"
          >
            🚪 Ausloggen
          </button>

        </div>

        <div class="section-title">
          Meine Aufgaben
        </div>

        <div class="card">

          <div class="settings-row">

            <div class="settings-row-icon">
              🗑️
            </div>

            <div class="settings-row-main">

              <div class="settings-row-title">
                Müll
              </div>

              <div class="settings-row-sub">
                ${
                  Number(currentTurn("trash")) ===
                  Number(S.mySlot)
                    ? "Du bist aktuell dran."
                    : `${esc(userName(currentTurn("trash")))} ist aktuell dran.`
                }
              </div>

            </div>

          </div>

          <div class="settings-row">

            <div class="settings-row-icon">
              🧹
            </div>

            <div class="settings-row-main">

              <div class="settings-row-title">
                Putzen
              </div>

              <div class="settings-row-sub">
                ${
                  Number(currentTurn("clean")) ===
                  Number(S.mySlot)
                    ? "Du bist aktuell dran."
                    : `${esc(userName(currentTurn("clean")))} ist aktuell dran.`
                }
              </div>

            </div>

          </div>

        </div>

        ${
          me?.isAdmin
            ? `
              <div class="section-title">
                Projekt Demo
              </div>

              <div class="card profile-card">

                <div style="font-size:12px;color:var(--muted);line-height:1.5;margin-bottom:12px;">
                  Hassan ist als Administrator eingerichtet.
                  Über die Admin Einstellungen kannst du die
                  Rotationen und WG Reihenfolge ändern.
                </div>

                <button
                  class="action-btn gray-btn"
                  onclick="adminResetAll()"
                  style="width:100%;"
                >
                  🔄 Demo-Daten zurücksetzen
                </button>

              </div>
            `
            : ""
        }

      `;
    }

    /* =========================================================
       SWIPE SUPPORT
    ========================================================= */

    function attachSwipe() {

      document
        .querySelectorAll(
          ".task-card[data-swipe-type]"
        )
        .forEach(card => {

          let startX = 0;
          let startY = 0;
          let active = false;

          card.addEventListener(
            "touchstart",
            event => {

              const target =
                event.target;

              if (
                target.closest("button") ||
                target.closest("input") ||
                target.closest("select")
              ) {
                active = false;
                return;
              }

              const touch =
                event.touches[0];

              startX =
                touch.clientX;

              startY =
                touch.clientY;

              active = true;
            },
            { passive: true }
          );

          card.addEventListener(
            "touchend",
            event => {

              if (!active) return;

              const touch =
                event.changedTouches[0];

              const dx =
                touch.clientX - startX;

              const dy =
                touch.clientY - startY;

              active = false;

              if (
                dx < -85 &&
                Math.abs(dx) > Math.abs(dy)
              ) {

                const type =
                  card.dataset.swipeType;

                skipTurn(type);
              }

            },
            { passive: true }
          );

        });
    }

    /* =========================================================
       KEYBOARD SHORTCUTS
    ========================================================= */

    document.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Escape"
        ) {

          const modal =
            document.getElementById("modalRoot");

          if (modal) {
            modal.innerHTML = "";
          }

        }

      }
    );

    /* =========================================================
       BOOT
    ========================================================= */

    loadLocalLogin();
    updateLoginVisibility();

    /*
      Initial render will be refreshed automatically
      when Firebase sends the current data.
    */

    if (S.isLoggedIn) {
      render();
    }

  </script>
