<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07111f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>KINGEN WG</title>

  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>

  <style>
    :root{
      --bg:#06101d;
      --bg2:#0a1727;
      --card:rgba(18,34,55,.78);
      --card2:rgba(25,45,72,.72);
      --line:rgba(255,255,255,.09);
      --text:#f7fbff;
      --muted:#91a5bc;
      --blue:#2997ff;
      --blue2:#0068ff;
      --green:#30d158;
      --orange:#ff9f0a;
      --red:#ff453a;
      --purple:#bf5af2;
      --shadow:0 18px 50px rgba(0,0,0,.30);
      --radius:24px;
    }

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
    }

    html,body{
      margin:0;
      padding:0;
      min-height:100%;
      background:
        radial-gradient(circle at 20% -10%,rgba(41,151,255,.20),transparent 32%),
        radial-gradient(circle at 100% 20%,rgba(0,104,255,.10),transparent 30%),
        var(--bg);
      color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,Arial,sans-serif;
    }

    body{
      min-height:100vh;
      overflow-x:hidden;
    }

    button,input,select{
      font:inherit;
    }

    button{
      border:0;
      cursor:pointer;
      color:inherit;
    }

    .hidden{
      display:none!important;
    }

    .app{
      width:100%;
      max-width:680px;
      margin:0 auto;
      min-height:100vh;
      padding-bottom:100px;
    }

    /* LOGIN */

    #loginScreen{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }

    .login-wrap{
      width:100%;
      max-width:440px;
    }

    .brand{
      text-align:center;
      margin-bottom:30px;
    }

    .brand-icon{
      width:78px;
      height:78px;
      margin:0 auto 16px;
      border-radius:25px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:36px;
      background:linear-gradient(145deg,#2997ff,#005eea);
      box-shadow:0 18px 45px rgba(0,105,255,.30);
    }

    .brand h1{
      margin:0;
      font-size:32px;
      letter-spacing:-1.4px;
    }

    .brand p{
      color:var(--muted);
      margin:8px 0 0;
    }

    .login-card{
      background:rgba(14,29,47,.88);
      border:1px solid var(--line);
      border-radius:30px;
      padding:22px;
      box-shadow:var(--shadow);
      backdrop-filter:blur(25px);
    }

    .login-label{
      color:var(--muted);
      font-size:13px;
      margin:0 0 9px 4px;
    }

    .user-picker{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      margin-bottom:18px;
    }

    .user-option{
      padding:13px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.035);
      border-radius:17px;
      display:flex;
      align-items:center;
      gap:10px;
      text-align:left;
      transition:.2s;
    }

    .user-option.active{
      border-color:rgba(41,151,255,.75);
      background:rgba(41,151,255,.14);
      box-shadow:0 0 0 2px rgba(41,151,255,.08);
    }

    .avatar{
      width:40px;
      height:40px;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      color:white;
      font-weight:800;
      flex:none;
    }

    .avatar.small{
      width:34px;
      height:34px;
      font-size:12px;
    }

    .avatar.tiny{
      width:28px;
      height:28px;
      font-size:10px;
    }

    .c0{background:linear-gradient(135deg,#007aff,#5856d6)}
    .c1{background:linear-gradient(135deg,#ff9500,#ff375f)}
    .c2{background:linear-gradient(135deg,#30d158,#00a878)}
    .c3{background:linear-gradient(135deg,#bf5af2,#af52de)}

    .password{
      width:100%;
      padding:15px 16px;
      border:1px solid var(--line);
      border-radius:17px;
      outline:none;
      background:rgba(255,255,255,.05);
      color:white;
      margin-bottom:12px;
    }

    .primary{
      width:100%;
      padding:15px 18px;
      border-radius:17px;
      background:linear-gradient(135deg,var(--blue),var(--blue2));
      color:white;
      font-weight:800;
      box-shadow:0 10px 30px rgba(0,104,255,.25);
    }

    .login-error{
      color:#ff6b64;
      text-align:center;
      margin-top:12px;
      font-size:13px;
    }

    /* HEADER */

    .topbar{
      padding:calc(15px + env(safe-area-inset-top)) 18px 12px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      position:sticky;
      top:0;
      z-index:20;
      background:rgba(6,16,29,.78);
      backdrop-filter:blur(22px);
    }

    .top-left{
      display:flex;
      align-items:center;
      gap:11px;
    }

    .mini-brand{
      width:42px;
      height:42px;
      border-radius:14px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:linear-gradient(145deg,#2997ff,#0068ff);
      font-size:20px;
    }

    .top-title{
      font-size:18px;
      font-weight:850;
      letter-spacing:-.5px;
    }

    .top-sub{
      color:var(--muted);
      font-size:11px;
      margin-top:2px;
    }

    .top-actions{
      display:flex;
      gap:8px;
    }

    .icon-btn{
      width:42px;
      height:42px;
      border-radius:14px;
      background:rgba(255,255,255,.055);
      border:1px solid var(--line);
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
    }

    .notification-dot{
      position:absolute;
      right:7px;
      top:7px;
      width:7px;
      height:7px;
      border-radius:50%;
      background:var(--red);
    }

    /* CONTENT */

    .content{
      padding:8px 16px 20px;
    }

    .tab-page{
      animation:pageIn .25s ease;
    }

    @keyframes pageIn{
      from{opacity:0;transform:translateY(7px)}
      to{opacity:1;transform:translateY(0)}
    }

    .welcome{
      padding:12px 4px 20px;
    }

    .welcome h2{
      margin:0;
      font-size:28px;
      letter-spacing:-1.2px;
    }

    .welcome p{
      margin:5px 0 0;
      color:var(--muted);
    }

    .hero-card{
      background:
        radial-gradient(circle at 90% 10%,rgba(41,151,255,.30),transparent 38%),
        linear-gradient(145deg,#102c4b,#0b1a2e);
      border:1px solid rgba(70,164,255,.20);
      border-radius:28px;
      padding:20px;
      box-shadow:var(--shadow);
      margin-bottom:14px;
    }

    .hero-top{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
    }

    .eyebrow{
      color:#7fbaff;
      font-size:11px;
      font-weight:800;
      text-transform:uppercase;
      letter-spacing:1px;
    }

    .hero-card h3{
      margin:5px 0 4px;
      font-size:25px;
      letter-spacing:-1px;
    }

    .hero-card p{
      margin:0;
      color:#a9c0d9;
      font-size:14px;
    }

    .turn-avatar{
      width:56px;
      height:56px;
      border-radius:18px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:17px;
      font-weight:900;
    }

    .progress-row{
      margin-top:18px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      color:#a9c0d9;
      font-size:12px;
    }

    .progress{
      height:7px;
      border-radius:99px;
      background:rgba(255,255,255,.09);
      margin-top:7px;
      overflow:hidden;
    }

    .progress span{
      display:block;
      height:100%;
      border-radius:99px;
      background:linear-gradient(90deg,#2997ff,#62b5ff);
    }

    .section-title{
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin:20px 3px 10px;
    }

    .section-title h3{
      margin:0;
      font-size:18px;
      letter-spacing:-.4px;
    }

    .section-title span{
      color:var(--muted);
      font-size:12px;
    }

    /* TASK CARDS */

    .task-card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:25px;
      padding:17px;
      margin-bottom:12px;
      box-shadow:0 12px 30px rgba(0,0,0,.14);
      backdrop-filter:blur(20px);
      touch-action:pan-y;
      transition:transform .2s,opacity .2s;
    }

    .task-card.swiping{
      transition:none;
    }

    .task-head{
      display:flex;
      align-items:center;
      gap:12px;
    }

    .task-icon{
      width:48px;
      height:48px;
      border-radius:16px;
      background:rgba(41,151,255,.13);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:24px;
    }

    .task-info{
      flex:1;
      min-width:0;
    }

    .task-info strong{
      display:block;
      font-size:16px;
    }

    .task-info small{
      display:block;
      color:var(--muted);
      margin-top:3px;
    }

    .badge{
      display:inline-flex;
      align-items:center;
      gap:5px;
      padding:6px 9px;
      border-radius:99px;
      font-size:10px;
      font-weight:800;
      background:rgba(48,209,88,.12);
      color:#67e985;
      white-space:nowrap;
    }

    .badge.orange{
      background:rgba(255,159,10,.13);
      color:#ffb340;
    }

    .badge.red{
      background:rgba(255,69,58,.13);
      color:#ff746d;
    }

    .task-actions{
      display:flex;
      gap:8px;
      margin-top:14px;
    }

    .action{
      flex:1;
      padding:12px;
      border-radius:15px;
      background:rgba(255,255,255,.055);
      border:1px solid var(--line);
      font-weight:750;
      font-size:13px;
    }

    .action.done{
      background:rgba(48,209,88,.12);
      color:#6be987;
      border-color:rgba(48,209,88,.15);
    }

    .action.skip{
      color:#ffadad;
    }

    /* TRASH SELECTOR */

    .trash-types{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
      margin-top:15px;
    }

    .trash-type{
      padding:12px 10px;
      border:1px solid var(--line);
      border-radius:16px;
      background:rgba(255,255,255,.035);
      text-align:left;
      transition:.18s;
    }

    .trash-type.active{
      background:rgba(41,151,255,.14);
      border-color:rgba(41,151,255,.65);
      box-shadow:0 0 0 2px rgba(41,151,255,.06);
    }

    .trash-type .emoji{
      font-size:20px;
      margin-right:7px;
    }

    .trash-type strong{
      font-size:12px;
    }

    .selected-trash{
      margin-top:12px;
      font-size:12px;
      color:#8fc7ff;
      background:rgba(41,151,255,.08);
      border-radius:13px;
      padding:10px 12px;
    }

    /* DUE */

    .due-card{
      background:linear-gradient(145deg,rgba(75,27,34,.65),rgba(27,24,35,.72));
      border:1px solid rgba(255,69,58,.18);
      border-radius:23px;
      padding:16px;
      margin-bottom:11px;
    }

    .due-top{
      display:flex;
      align-items:center;
      gap:12px;
    }

    .due-main{
      flex:1;
    }

    .due-main strong{
      display:block;
    }

    .due-main small{
      color:#a88f93;
      display:block;
      margin-top:4px;
    }

    .due-button{
      margin-top:13px;
      width:100%;
      padding:12px;
      border-radius:14px;
      background:rgba(48,209,88,.12);
      color:#72eb8d;
      font-weight:800;
    }

    .empty{
      text-align:center;
      padding:50px 20px;
      color:var(--muted);
    }

    .empty .big{
      font-size:40px;
      margin-bottom:10px;
    }

    /* CALENDAR */

    .calendar-card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:25px;
      padding:16px;
    }

    .calendar-head{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:16px;
    }

    .calendar-month{
      font-weight:850;
      font-size:18px;
      text-transform:capitalize;
    }

    .calendar-nav{
      display:flex;
      gap:7px;
    }

    .calendar-nav button{
      width:36px;
      height:36px;
      border-radius:12px;
      background:rgba(255,255,255,.06);
    }

    .weekdays,.calendar-grid{
      display:grid;
      grid-template-columns:repeat(7,1fr);
      gap:5px;
    }

    .weekday{
      text-align:center;
      color:var(--muted);
      font-size:10px;
      font-weight:700;
      padding-bottom:5px;
    }

    .day{
      min-height:52px;
      border-radius:14px;
      background:rgba(255,255,255,.025);
      border:1px solid transparent;
      padding:6px;
      position:relative;
      text-align:left;
      color:white;
    }

    .day.other{
      opacity:.28;
    }

    .day.today{
      border-color:rgba(41,151,255,.45);
    }

    .day.selected{
      background:rgba(41,151,255,.18);
      border-color:rgba(41,151,255,.7);
    }

    .day-number{
      font-size:11px;
      font-weight:800;
    }

    .event-dots{
      display:flex;
      gap:3px;
      position:absolute;
      left:7px;
      bottom:7px;
    }

    .event-dot{
      width:5px;
      height:5px;
      border-radius:50%;
      background:#2997ff;
    }

    .day-events{
      margin-top:15px;
    }

    .event{
      display:flex;
      gap:10px;
      align-items:center;
      padding:11px 0;
      border-bottom:1px solid var(--line);
    }

    .event:last-child{
      border-bottom:0;
    }

    .event-icon{
      width:38px;
      height:38px;
      border-radius:12px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:rgba(255,255,255,.06);
    }

    .event-text{
      flex:1;
    }

    .event-text strong{
      display:block;
      font-size:13px;
    }

    .event-text small{
      color:var(--muted);
      display:block;
      margin-top:3px;
    }

    /* CHAT */

    .chat-tabs{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:6px;
      padding:5px;
      border-radius:16px;
      background:rgba(255,255,255,.05);
      margin-bottom:14px;
    }

    .chat-tab{
      padding:11px;
      border-radius:12px;
      background:transparent;
      color:var(--muted);
      font-weight:750;
    }

    .chat-tab.active{
      background:rgba(255,255,255,.09);
      color:white;
    }

    .chat-list{
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    .chat-row{
      display:flex;
      align-items:center;
      gap:12px;
      padding:14px;
      border-radius:19px;
      background:var(--card);
      border:1px solid var(--line);
      text-align:left;
    }

    .chat-row-main{
      flex:1;
      min-width:0;
    }

    .chat-row-main strong{
      display:block;
    }

    .chat-row-main small{
      display:block;
      color:var(--muted);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      margin-top:3px;
    }

    .unread{
      min-width:20px;
      height:20px;
      border-radius:99px;
      background:var(--blue);
      font-size:10px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:800;
    }

    .chat-room{
      display:flex;
      flex-direction:column;
      min-height:60vh;
    }

    .chat-room-head{
      display:flex;
      align-items:center;
      gap:10px;
      margin-bottom:10px;
    }

    .back{
      width:40px;
      height:40px;
      border-radius:13px;
      background:rgba(255,255,255,.06);
    }

    .messages{
      flex:1;
      padding:10px 2px 15px;
      min-height:390px;
    }

    .message{
      max-width:82%;
      margin-bottom:9px;
      display:flex;
      flex-direction:column;
      align-items:flex-start;
    }

    .message.mine{
      margin-left:auto;
      align-items:flex-end;
    }

    .bubble{
      background:rgba(255,255,255,.08);
      border:1px solid var(--line);
      padding:10px 13px;
      border-radius:17px;
      font-size:14px;
      line-height:1.35;
    }

    .message.mine .bubble{
      background:linear-gradient(135deg,#1688ff,#0068ff);
      border-color:transparent;
    }

    .message-meta{
      color:var(--muted);
      font-size:9px;
      margin:3px 4px;
    }

    .chat-compose{
      display:flex;
      gap:8px;
      padding-top:8px;
      position:sticky;
      bottom:85px;
    }

    .chat-input{
      flex:1;
      min-width:0;
      padding:13px 15px;
      border-radius:17px;
      background:rgba(255,255,255,.07);
      border:1px solid var(--line);
      color:white;
      outline:none;
    }

    .send-btn{
      width:48px;
      border-radius:16px;
      background:var(--blue);
      font-size:19px;
    }

    /* LOG */

    .log-item{
      display:flex;
      gap:11px;
      padding:13px 0;
      border-bottom:1px solid var(--line);
    }

    .log-icon{
      width:40px;
      height:40px;
      border-radius:13px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:rgba(255,255,255,.06);
    }

    .log-main{
      flex:1;
    }

    .log-main strong{
      display:block;
      font-size:13px;
    }

    .log-main small{
      display:block;
      color:var(--muted);
      margin-top:3px;
    }

    /* ADMIN */

    .admin-card{
      background:linear-gradient(145deg,rgba(89,43,115,.35),rgba(22,25,48,.75));
      border:1px solid rgba(191,90,242,.20);
      border-radius:24px;
      padding:17px;
      margin-top:14px;
    }

    .admin-title{
      display:flex;
      align-items:center;
      gap:10px;
      margin-bottom:15px;
    }

    .admin-title strong{
      font-size:16px;
    }

    .order-section{
      margin-top:17px;
    }

    .order-section h4{
      margin:0 0 9px;
      font-size:13px;
      color:#caa9e8;
    }

    .order-row{
      display:flex;
      align-items:center;
      gap:9px;
      padding:9px;
      border-radius:15px;
      background:rgba(255,255,255,.045);
      margin-bottom:6px;
    }

    .order-position{
      width:25px;
      height:25px;
      border-radius:8px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:rgba(255,255,255,.07);
      font-size:11px;
      color:var(--muted);
    }

    .order-row .avatar{
      width:31px;
      height:31px;
      font-size:10px;
    }

    .order-name{
      flex:1;
      font-size:13px;
      font-weight:750;
    }

    .move-btn{
      width:31px;
      height:31px;
      border-radius:9px;
      background:rgba(255,255,255,.06);
      color:#c5d2e0;
    }

    .move-btn:disabled{
      opacity:.2;
    }

    .current-set{
      margin-top:9px;
      padding:11px;
      border-radius:14px;
      background:rgba(41,151,255,.08);
      color:#8ec7ff;
      font-size:12px;
    }

    .set-current{
      margin-top:7px;
      display:flex;
      gap:6px;
      overflow-x:auto;
      padding-bottom:3px;
    }

    .person-chip{
      flex:none;
      padding:9px 11px;
      border-radius:12px;
      background:rgba(255,255,255,.06);
      border:1px solid var(--line);
      font-size:11px;
    }

    /* BOTTOM NAV */

    .bottom-nav{
      position:fixed;
      left:50%;
      transform:translateX(-50%);
      bottom:0;
      width:min(680px,100%);
      padding:8px 10px calc(8px + env(safe-area-inset-bottom));
      background:rgba(5,14,25,.88);
      border-top:1px solid var(--line);
      backdrop-filter:blur(25px);
      display:grid;
      grid-template-columns:repeat(5,1fr);
      z-index:30;
    }

    .nav-btn{
      position:relative;
      background:transparent;
      color:#687f98;
      padding:6px 2px 3px;
      border-radius:15px;
      font-size:10px;
      font-weight:700;
    }

    .nav-icon{
      display:block;
      font-size:20px;
      line-height:22px;
      margin-bottom:3px;
      filter:grayscale(1);
      opacity:.8;
    }

    .nav-btn.active{
      color:#66b5ff;
      background:rgba(41,151,255,.08);
    }

    .nav-btn.active .nav-icon{
      filter:none;
      opacity:1;
    }

    .nav-badge{
      position:absolute;
      top:2px;
      right:20%;

      height:16px;

      font-size:9px;
      display:flex;
      align-items:center;
      justify-content:center;

    /* MODAL */

    .modal-backdrop{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.65);
      backdrop-filter:blur(8px);
      z-index:100;
      display:flex;
      align-items:flex-end;

    .modal{
      width:min(680px,100%);
      max-height:85vh;
      overflow:auto;
      background:#0b1a2c;
      border:1px solid var(--line);
      border-radius:28px 28px 0 0;
      padding:18px 18px calc(22px + env(safe-area-inset-bottom));
      animation:sheet .25s ease;
    }

    @keyframes sheet{
      from{transform:translateY(100%)}
      to{transform:translateY(0)}
    }

    .modal-handle{
      width:42px;
      height:4px;
      border-radius:99px;
      background:#40556c;
      margin:0 auto 17px;
    }

    .modal-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom:12px;
    }

    .modal-head h3{
      margin:0;
    }

    .close{
      width:36px;
      height:36px;
      border-radius:12px;
      background:rgba(255,255,255,.06);
    }

    /* TOAST */

    #toast{
      position:fixed;
      left:50%;
      bottom:95px;
      transform:translate(-50%,20px);
      background:rgba(22,37,55,.96);
      border:1px solid var(--line);
      padding:12px 16px;
      border-radius:15px;
      box-shadow:var(--shadow);
      opacity:0;
      pointer-events:none;
      transition:.25s;
      z-index:200;
      font-size:13px;
      white-space:nowrap;
      max-width:90%;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    #toast.show{
      opacity:1;
      transform:translate(-50%,0);
    }

    @media(max-width:390px){
      .user-picker{
        grid-template-columns:1fr;
      }

      .trash-types{
        grid-template-columns:1fr 1fr;
      }

      .day{
        min-height:47px;
      }
    }
  </style>
</head>

<body>

  <!-- LOGIN -->
  <section id="loginScreen">
    <div class="login-wrap">
      <div class="brand">
        <div class="brand-icon">🏠</div>
        <h1>KINGEN WG</h1>
        <p>Die WG. Die Aufgaben. Ein Ort.</p>
      </div>

      <div class="login-card">
        <div class="login-label">Wer bist du?</div>
        <div id="userPicker" class="user-picker"></div>

        <div class="login-label">WG-Code</div>
        <input
          id="password"
          class="password"
          type="password"
          inputmode="numeric"
          maxlength="8"
          placeholder="1234"
        />

        <button class="primary" onclick="login()">
          Einloggen
        </button>

        <div id="loginError" class="login-error hidden"></div>
      </div>
    </div>
  </section>

  <!-- APP -->
  <main id="app" class="app hidden">

    <header class="topbar">
      <div class="top-left">
        <div class="mini-brand">🏠</div>
        <div>
          <div class="top-title">KINGEN WG</div>
          <div id="topSub" class="top-sub">WG Übersicht</div>
        </div>
      </div>

      <div class="top-actions">
        <button class="icon-btn" onclick="openNotifications()" aria-label="Benachrichtigungen">
          🔔
          <span id="notificationDot" class="notification-dot hidden"></span>
        </button>

        <button class="icon-btn" onclick="openProfile()" aria-label="Profil">
          <span id="topAvatar"></span>
        </button>
      </div>
    </header>

    <div id="content" class="content"></div>

    <nav class="bottom-nav">
      <button id="nav-home" class="nav-btn" onclick="setTab('home')">
        <span class="nav-icon">⌂</span>
        Übersicht
      </button>

      <button id="nav-due" class="nav-btn" onclick="setTab('due')">
        <span class="nav-icon">◷</span>
        Fällig
        <span id="dueBadge" class="nav-badge hidden"></span>
      </button>

      <button id="nav-calendar" class="nav-btn" onclick="setTab('calendar')">
        <span class="nav-icon">▣</span>
        Kalender
      </button>

      <button id="nav-chat" class="nav-btn" onclick="setTab('chat')">
        <span class="nav-icon">◌</span>
        Chats
        <span id="chatBadge" class="nav-badge hidden"></span>
      </button>

      <button id="nav-log" class="nav-btn" onclick="setTab('log')">
        <span class="nav-icon">☷</span>
        Verlauf
      </button>
    </nav>
  </main>

  <div id="modalRoot"></div>
  <div id="toast"></div>

  <script type="module">

    /* =========================================================
       FIREBASE
    ========================================================= */

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getDatabase,
      ref,
      set,
      onValue
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAv-1UXuNTE8U8FbV8fpFFYgV6GR1nkQVM",
      authDomain: "kingenwg.firebaseapp.com",
      databaseURL: "https://kingenwg-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "kingenwg",
      storageBucket: "kingenwg.firebasestorage.app",
      messagingSenderId: "959662859826",
      appId: "1:959662859826:web:b44260e9944545fa58fe2b"
    };

    const firebaseApp = initializeApp(firebaseConfig);
    const db = getDatabase(firebaseApp);
    const DB_PATH = "wg_secure_v6";

    const WG_PASSWORD = "1234";

    const ONESIGNAL_APP_ID =
      "ccca5ec6-33c7-4921-a67a-d3b06de45512";


    /* =========================================================
       USERS
    ========================================================= */

    const DEFAULT_USERS = [
      {
        id:0,
        name:"Jacky",
        deviceId:"",
        colorId:0,
        isAdmin:false
      },
      {
        id:1,
        name:"Hassan",
        deviceId:"",
        colorId:1,
        isAdmin:true
      },
      {
        id:2,
        name:"Suraj",
        deviceId:"",
        colorId:2,
        isAdmin:false
      },
      {
        id:3,
        name:"Andreas",
        deviceId:"",
        colorId:3,
        isAdmin:false
      }
    ];


    /* =========================================================
       ALL 4 MÜLL TYPES
    ========================================================= */

    const TRASH_TYPES = [
      {
        id:"rest",
        name:"Restmüll",
        icon:"🗑️"
      },
      {
        id:"yellow",
        name:"Gelber Sack",
        icon:"♻️"
      },
      {
        id:"paper",
        name:"Papier",
        icon:"📦"
      },
      {
        id:"bio",
        name:"Bio",
        icon:"🌱"
      }
    ];


    /* =========================================================
       APP STATE
    ========================================================= */

    const S = {
      trashOrder:[0,1,2,3],
      cleanOrder:[0,1,2,3],

      trashPos:0,
      cleanPos:0,

      globalLog:[],
      users:JSON.parse(JSON.stringify(DEFAULT_USERS)),

      groupChat:[],
      privateChats:{},

      dueTasks:[],

      tab:"home",
      chatSubTab:"group",
      activePrivatePartner:null,

      isLoggedIn:false,
      mySlot:0,

      selectedTrashType:
        localStorage.getItem("wg_selected_trash") || "rest"
    };


    let calendarCursor = new Date();
    let selectedDateKey = dateKey(Date.now());

    let saveTimer = null;


    /* =========================================================
       HELPERS
    ========================================================= */

    function esc(value){
      return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
    }

    function initials(name){
      return String(name || "?")
        .trim()
        .split(/\s+/)
        .map(x => x[0])
        .join("")
        .slice(0,2)
        .toUpperCase();
    }

    function getUser(id){
      return S.users.find(u => Number(u.id) === Number(id));
    }

    function me(){
      return getUser(S.mySlot) || S.users[0];
    }

    function trashType(id){
      return TRASH_TYPES.find(t => t.id === id) || TRASH_TYPES[0];
    }

    function dateKey(timestamp){
      const d = new Date(timestamp);

      return [
        d.getFullYear(),
        String(d.getMonth()+1).padStart(2,"0"),
        String(d.getDate()).padStart(2,"0")
      ].join("-");
    }

    function formatTime(timestamp){
      return new Date(timestamp).toLocaleTimeString("de-DE",{
        hour:"2-digit",
        minute:"2-digit"
      });
    }

    function formatDate(timestamp){
      return new Date(timestamp).toLocaleDateString("de-DE",{
        day:"2-digit",
        month:"2-digit",
        year:"numeric"
      });
    }

    function formatShortDate(timestamp){
      return new Date(timestamp).toLocaleDateString("de-DE",{
        day:"2-digit",
        month:"2-digit"
      });
    }

    function getCurrent(type){
      const orderKey = type === "trash"
        ? "trashOrder"
        : "cleanOrder";

      const posKey = type === "trash"
        ? "trashPos"
        : "cleanPos";

      const order = S[orderKey] || [];
      if(!order.length) return S.users[0];

      return getUser(order[S[posKey] % order.length]) || S.users[0];
    }

    function currentPosition(type){
      const posKey = type === "trash"
        ? "trashPos"
        : "cleanPos";

      const orderKey = type === "trash"
        ? "trashOrder"
        : "cleanOrder";

      return (S[posKey] || 0) % Math.max(1,S[orderKey].length);
    }

    function advance(type){
      const posKey = type === "trash"
        ? "trashPos"
        : "cleanPos";

      const orderKey = type === "trash"
        ? "trashOrder"
        : "cleanOrder";

      if(!S[orderKey]?.length) return;

      S[posKey] =
        (Number(S[posKey] || 0) + 1) %
        S[orderKey].length;
    }

    function typeLabel(type){
      return type === "trash" ? "Müll" : "Putzen";
    }

    function typeIcon(type){
      return type === "trash" ? "🗑️" : "🧹";
    }

    function showToast(text){
      const el = document.getElementById("toast");
      el.textContent = text;
      el.classList.add("show");

      clearTimeout(showToast.timer);

      showToast.timer = setTimeout(()=>{
        el.classList.remove("show");
      },2200);
    }

    function logEvent(event){
      if(!Array.isArray(S.globalLog)){
        S.globalLog = [];
      }

      S.globalLog.unshift({
        time:Date.now(),
        ...event
      });

      S.globalLog =
        S.globalLog.slice(0,500);
    }


    /* =========================================================
       SAVE / FIREBASE
    ========================================================= */

    function cloudState(){
      return {
        trashOrder:S.trashOrder,
        cleanOrder:S.cleanOrder,

        trashPos:S.trashPos,
        cleanPos:S.cleanPos,

        globalLog:S.globalLog || [],

        users:S.users || DEFAULT_USERS,

        groupChat:S.groupChat || [],
        privateChats:S.privateChats || {},

        dueTasks:S.dueTasks || []
      };
    }

    function saveToCloud(){
      clearTimeout(saveTimer);

      saveTimer = setTimeout(async ()=>{
        try{
          await set(
            ref(db,DB_PATH),
            cloudState()
          );
        }catch(error){
          console.error("Firebase save failed:",error);
          showToast("Cloud-Speichern nicht möglich");
        }
      },120);
    }


    function migrateUsers(users){
      const incoming =
        Array.isArray(users) && users.length
          ? users
          : JSON.parse(JSON.stringify(DEFAULT_USERS));

      return incoming.map((u,index)=>{
        const user = {
          id:Number(u.id ?? index),
          name:String(u.name || DEFAULT_USERS[index]?.name || `User ${index+1}`),
          deviceId:u.deviceId || "",
          colorId:Number(u.colorId ?? index),
          isAdmin:Boolean(u.isAdmin)
        };

        if(user.name === "Her"){
          user.name = "Andreas";
        }

        if(user.id === 1 || user.name === "Hassan"){
          user.isAdmin = true;
        }

        return user;
      });
    }


    onValue(ref(db,DB_PATH),(snapshot)=>{
      const data = snapshot.val();

      if(data){

        S.users =
          migrateUsers(data.users);

        S.trashOrder =
          Array.isArray(data.trashOrder)
            ? data.trashOrder.map(Number)
            : S.users.map(u=>u.id);

        S.cleanOrder =
          Array.isArray(data.cleanOrder)
            ? data.cleanOrder.map(Number)
            : S.users.map(u=>u.id);

        S.trashPos =
          Number(data.trashPos ?? 0);

        S.cleanPos =
          Number(data.cleanPos ?? 0);

        S.globalLog =
          Array.isArray(data.globalLog)
            ? data.globalLog
            : [];

        S.groupChat =
          Array.isArray(data.groupChat)
            ? data.groupChat
            : [];

        S.privateChats =
          data.privateChats || {};

        S.dueTasks =
          Array.isArray(data.dueTasks)
            ? data.dueTasks
            : [];

        normalizeOrders();

        /*
          Automatically migrate old "Her" entries in existing
          log/chat data to Andreas.
        */
        migrateOldNames();

        saveToCloud();

        render();
      }
    });


    function normalizeOrders(){
      const ids = S.users.map(u=>u.id);

      function normalize(order){
        const clean = [];

        order.forEach(id=>{
          const n = Number(id);

          if(
            ids.includes(n) &&
            !clean.includes(n)
          ){
            clean.push(n);
          }
        });

        ids.forEach(id=>{
          if(!clean.includes(id)){
            clean.push(id);
          }
        });

        return clean;
      }

      S.trashOrder = normalize(S.trashOrder);
      S.cleanOrder = normalize(S.cleanOrder);

      S.trashPos =
        Math.max(
          0,
          Math.min(
            S.trashPos,
            S.trashOrder.length-1
          )
        );

      S.cleanPos =
        Math.max(
          0,
          Math.min(
            S.cleanPos,
            S.cleanOrder.length-1
          )
        );
    }


    function migrateOldNames(){
      let changed = false;

      S.globalLog.forEach(item=>{
        if(item.userName === "Her"){
          item.userName = "Andreas";
          changed = true;
        }
      });

      S.groupChat.forEach(item=>{
        if(item.userName === "Her"){
          item.userName = "Andreas";
          changed = true;
        }
      });

      if(changed){
        saveToCloud();
      }
    }


    /* =========================================================
       ONESIGNAL
    ========================================================= */

    window.OneSignalDeferred =
      window.OneSignalDeferred || [];

    window.OneSignalDeferred.push(
      async function(OneSignal){

        try{
          await OneSignal.init({
            appId:ONESIGNAL_APP_ID
          });

          window.__oneSignal = OneSignal;

          if(
            S.isLoggedIn &&
            typeof OneSignal.login === "function"
          ){
            await OneSignal.login(
              "user_" + S.mySlot
            );
          }

        }catch(error){
          console.warn(
            "OneSignal unavailable:",
            error
          );
        }
      }
    );


    async function connectOneSignal(){
      try{
        const OS = window.__oneSignal;

        if(!OS) return;

        const externalId =
          "user_" + S.mySlot;

        if(
          typeof OS.login === "function"
        ){
          await OS.login(externalId);
        }
        else if(
          OS.User &&
          typeof OS.User.login === "function"
        ){
          await OS.User.login(externalId);
        }

      }catch(error){
        console.warn(
          "OneSignal login failed:",
          error
        );
      }
    }


    async function sendPushToUser(
      userId,
      title,
      message
    ){
      try{
        await fetch(
          "/api/send-push",
          {
            method:"POST",
            headers:{
              "Content-Type":
                "application/json"
            },
            body:JSON.stringify({
              userId:"user_"+userId,
              title,
              message
            })
          }
        );
      }catch(error){
        /*
          Push API is optional. The app should
          continue working even without it.
        */
        console.log(
          "Push endpoint unavailable"
        );
      }
    }


    /* =========================================================
       LOGIN / LOGOUT
    ========================================================= */

    function renderLogin(){
      const picker =
        document.getElementById("userPicker");

      picker.innerHTML =
        S.users.map(user=>`
          <button
            class="user-option ${S.mySlot === user.id ? "active":""}"
            onclick="selectLoginUser(${user.id})"
          >
            <span class="avatar c${user.colorId}">
              ${esc(initials(user.name))}
            </span>

            <span>
              <strong>${esc(user.name)}</strong>
              ${
                user.isAdmin
                  ? `<small style="display:block;color:#bf8aff;margin-top:2px">Admin</small>`
                  : ""
              }
            </span>
          </button>
        `).join("");
    }

    window.selectLoginUser = function(id){
      S.mySlot = Number(id);

      localStorage.setItem(
        "wg_user_slot",
        String(S.mySlot)
      );

      renderLogin();
    };


    window.login = async function(){

      const password =
        document.getElementById("password").value;

      const error =
        document.getElementById("loginError");

      if(password !== WG_PASSWORD){
        error.textContent =
          "Falscher WG-Code.";

        error.classList.remove("hidden");
        return;
      }

      error.classList.add("hidden");

      S.isLoggedIn = true;

      localStorage.setItem(
        "wg_logged_in",
        "1"
      );

      localStorage.setItem(
        "wg_user_slot",
        String(S.mySlot)
      );

      await connectOneSignal();

      render();

      showToast(
        `Willkommen ${me().name}!`
      );
    };


    window.logout = function(){

      S.isLoggedIn = false;

      localStorage.removeItem(
        "wg_logged_in"
      );

      document.getElementById("password").value = "";

      render();

      showToast("Du bist ausgeloggt.");
    };


    function restoreLogin(){
      const logged =
        localStorage.getItem(
          "wg_logged_in"
        ) === "1";

      const slot =
        Number(
          localStorage.getItem(
            "wg_user_slot"
          ) || 0
        );

      S.mySlot =
        S.users.some(u=>u.id===slot)
          ? slot
          : 0;

      S.isLoggedIn = logged;
    }


    /* =========================================================
       NAVIGATION
    ========================================================= */

    window.setTab = function(tab){

      S.tab = tab;

      S.activePrivatePartner = null;

      render();

      window.scrollTo({
        top:0,
        behavior:"smooth"
      });
    };


    function updateNav(){

      [
        "home",
        "due",
        "calendar",
        "chat",
        "log"
      ].forEach(tab=>{
        const button =
          document.getElementById(
            "nav-"+tab
          );

        if(button){
          button.classList.toggle(
            "active",
            S.tab === tab
          );
        }
      });

      const dueCount =
        (S.dueTasks || []).length;

      const dueBadge =
        document.getElementById("dueBadge");

      if(dueCount){
        dueBadge.textContent =
          dueCount > 9 ? "9+" : dueCount;

        dueBadge.classList.remove("hidden");
      }else{
        dueBadge.classList.add("hidden");
      }

      const unread =
        getUnreadCount();

      const chatBadge =
        document.getElementById("chatBadge");

      if(unread){
        chatBadge.textContent =
          unread > 9 ? "9+" : unread;

        chatBadge.classList.remove("hidden");
      }else{
        chatBadge.classList.add("hidden");
      }

      const dot =
        document.getElementById(
          "notificationDot"
        );

      dot.classList.toggle(
        "hidden",
        dueCount === 0
      );
    }


    /* =========================================================
       HOME
    ========================================================= */

    function renderHome(){

      const trashUser =
        getCurrent("trash");

      const cleanUser =
        getCurrent("clean");

      const currentMe =
        me();

      const trashMine =
        trashUser.id === currentMe.id;

      const cleanMine =
        cleanUser.id === currentMe.id;

      const trashPos =
        currentPosition("trash")+1;

      const cleanPos =
        currentPosition("clean")+1;

      return `
        <div class="tab-page">

          <div class="welcome">
            <h2>Hallo ${esc(currentMe.name)} 👋</h2>
            <p>Hier ist euer WG-Status.</p>
          </div>

          <div class="hero-card">
            <div class="hero-top">
              <div>
                <div class="eyebrow">Aktueller Müll-Turn</div>
                <h3>${esc(trashUser.name)}</h3>
                <p>
                  Position ${trashPos} von ${S.trashOrder.length}
                </p>
              </div>

              <div class="turn-avatar c${trashUser.colorId}">
                ${esc(initials(trashUser.name))}
              </div>
            </div>

            <div class="progress-row">
              <span>Müll-Reihenfolge</span>
              <span>${trashPos}/${S.trashOrder.length}</span>
            </div>

            <div class="progress">
              <span style="width:${(trashPos/S.trashOrder.length)*100}%"></span>
            </div>

            ${
              trashMine
                ? `<div style="margin-top:15px;color:#72eb8d;font-size:13px;font-weight:800">
                    🟢 Du bist dran
                   </div>`
                : ""
            }
          </div>


          <!-- MÜLL -->

          <div class="section-title">
            <h3>🗑️ Müll</h3>
            <span>für alle auswählbar</span>
          </div>

          <div
            class="task-card"
            id="trashTaskCard"
            ontouchstart="swipeStart(event,'trash')"
            ontouchmove="swipeMove(event,'trash')"
            ontouchend="swipeEnd(event,'trash')"
          >

            <div class="task-head">
              <div class="task-icon">🗑️</div>

              <div class="task-info">
                <strong>
                  ${esc(trashUser.name)} ist dran
                </strong>

                <small>
                  Wähle zuerst die Müllart.
                </small>
              </div>

              <span class="badge">
                ${trashMine ? "Du" : "Nächster Turn"}
              </span>
            </div>

            <!-- ALL FOUR TYPES -->
            <div class="trash-types">

              ${TRASH_TYPES.map(t=>`
                <button
                  class="trash-type ${S.selectedTrashType === t.id ? "active":""}"
                  onclick="selectTrashType('${t.id}')"

    /* =========================================================
       COMPLETE TASK
    ========================================================= */

    window.completeTask = function(type){

      const current =
        getCurrent(type);

      if(!current){
        return;
      }

      const trash =
        type === "trash"
          ? trashType(S.selectedTrashType)
          : null;

      const taskName =
        type === "trash"
          ? `${trash.icon} ${trash.name}`
          : "🧹 Putzen";

      /*
        Remove matching due task.
      */
      S.dueTasks =
        (S.dueTasks || []).filter(d=>{
          if(
            Number(d.user) !== Number(current.id)
          ){
            return true;
          }

          if(d.type !== type){
            return true;
          }

          if(
            type === "trash" &&
            d.trashType &&
            d.trashType !== S.selectedTrashType
          ){
            return true;
          }

          return false;
        });

      logEvent({
        user:current.id,
        userName:current.name,
        action:"done",
        type,
        trashType:
          type === "trash"
            ? S.selectedTrashType
            : null,
        text:`${current.name} hat ${taskName} erledigt.`
      });

      advance(type);

      saveToCloud();

      render();

      showToast(
        `${taskName} erledigt ✓`
      );

      const next =
        getCurrent(type);

      if(next && next.id !== current.id){
        sendPushToUser(
          next.id,
          "Du bist jetzt dran!",
          `${current.name} hat ${typeLabel(type)} erledigt.`
        );
      }
    };


    /* =========================================================
       SKIP / DUE
    ========================================================= */

    window.skipTurn = function(type){

      const current =
        getCurrent(type);

      if(!current){
        return;
      }

      const selectedTrash =
        type === "trash"
          ? S.selectedTrashType
          : null;

      const exists =
        (S.dueTasks || []).some(d=>
          Number(d.user) === Number(current.id) &&
          d.type === type &&
          (
            type !== "trash" ||
            d.trashType === selectedTrash
          )
        );

      if(!exists){

        S.dueTasks.push({
          id:
            Date.now()+"_"+current.id+"_"+type,
          user:current.id,
          type,
          trashType:selectedTrash,
          time:Date.now(),
          reason:"skip"
        });

      }

      logEvent({
        user:current.id,
        userName:current.name,
        action:"skip",
        type,
        trashType:selectedTrash,
        text:`${current.name} hat ${typeLabel(type)} übersprungen.`
      });

      advance(type);

      const next =
        getCurrent(type);

      saveToCloud();

      render();

      showToast(
        `${current.name} hat gepasst → Due`
      );

      if(next){
        sendPushToUser(
          next.id,
          "Du bist jetzt dran!",
          `${current.name} hat ${typeLabel(type)} übersprungen.`
        );
      }
    };

    /* =========================================================
       CALENDAR
    ========================================================= */

    function renderCalendar(){

      const year =
        calendarCursor.getFullYear();

      const month =
        calendarCursor.getMonth();

      const monthName =
        calendarCursor.toLocaleDateString(
          "de-DE",
          {
            month:"long",
            year:"numeric"
          }
        );

      const first =
        new Date(year,month,1);

      let start =
        first.getDay();

      /*
        JS Sunday = 0.
        Calendar starts Monday.
      */
      start =
        start === 0
          ? 6
          : start-1;

      const daysInMonth =
        new Date(
          year,
          month+1,
          0
        ).getDate();

      const prevDays =
        new Date(
          year,
          month,
          0
        ).getDate();

      const today =
        dateKey(Date.now());

      let cells = "";

      for(let i=0;i<42;i++){

        const dayNumber =
          i-start+1;

        let cellDate;
        let number;
        let other = false;

        if(dayNumber < 1){
          number =
            prevDays+dayNumber;

          cellDate =
            new Date(
              year,
              month-1,
              number
            );

          other = true;

        }else if(dayNumber > daysInMonth){

          number =
            dayNumber-daysInMonth;

          cellDate =
            new Date(
              year,
              month+1,
              number
            );

          other = true;

        }else{

          number =
            dayNumber;

          cellDate =
            new Date(
              year,
              month,
              number
            );
        }

        const key =
          dateKey(cellDate.getTime());

        const events =
          getEventsForDate(key);

        const isToday =
          key === today;

        const selected =
          key === selectedDateKey;

        cells += `
          <button
            class="day
              ${other ? "other":""}
              ${isToday ? "today":""}
              ${selected ? "selected":""}
            "
            onclick="selectCalendarDate('${key}')"
          >

            <span class="day-number">
              ${number}
            </span>

            ${
              events.length
                ? `
                  <span class="event-dots">
                    ${events.slice(0,3).map(()=>
                      `<span class="event-dot"></span>`
                    ).join("")}
                  </span>
                `
                : ""
            }

          </button>
        `;
      }

      const selectedEvents =
        getEventsForDate(selectedDateKey);

      return `
        <div class="tab-page">

          <div class="welcome">
            <h2>Kalender</h2>
            <p>Wer hat wann was gemacht?</p>
          </div>

          <div class="calendar-card">

            <div class="calendar-head">

              <div class="calendar-month">
                ${esc(monthName)}
              </div>

              <div class="calendar-nav">
                <button onclick="changeCalendarMonth(-1)">
                  ‹
                </button>

                <button onclick="goCalendarToday()">
                  •
                </button>

                <button onclick="changeCalendarMonth(1)">
                  ›
                </button>
              </div>

            </div>

            <div class="weekdays">
              ${[
                "Mo","Di","Mi","Do","Fr","Sa","So"
              ].map(d=>
                `<div class="weekday">${d}</div>`
              ).join("")}
            </div>

            <div class="calendar-grid">
              ${cells}
            </div>

            <div class="day-events">

              <div class="section-title" style="margin-top:17px">
                <h3>
                  ${formatCalendarKey(selectedDateKey)}
                </h3>
                <span>
                  ${selectedEvents.length} Ereignis${selectedEvents.length===1?"":"se"}
                </span>
              </div>

              ${
                selectedEvents.length
                  ? selectedEvents.map(renderCalendarEvent).join("")
                  : `
                    <div class="empty" style="padding:28px 10px">
                      <div style="font-size:28px">📅</div>
                      <div style="margin-top:7px">
                        Noch keine Aufgaben an diesem Tag.
                      </div>
                    </div>
                  `
              }

            </div>

          </div>

        </div>
      `;
    }


    function getEventsForDate(key){

      return (S.globalLog || [])
        .filter(item =>
          dateKey(item.time) === key &&
          (
            item.action === "done" ||
            item.action === "skip" ||
            item.action === "due_done"
          )
        )
        .sort((a,b)=>
          Number(a.time)-Number(b.time)
        );
    }


    function renderCalendarEvent(event){

      const isTrash =
        event.type === "trash";

      const trash =

          ? trashType(event.trashType)
          : null;

      let icon =
        isTrash
          ? (trash?.icon || "🗑️")
          : "🧹";

      let task =
        isTrash
          ? (trash?.name || "Müll")
          : "Putzen";

      let actionText;

      if(event.action === "skip"){
        actionText = "übersprungen";
      }
      else if(event.action === "due_done"){
        actionText = "offene Aufgabe erledigt";

      return `
        <div class="event">

          <div class="event-icon">
            ${icon}

          <div class="event-text">

            <strong>
              ${esc(event.userName || "Unbekannt")}

            <small>

              · ${formatTime(event.time)}
            </small>

          </div>

        </div>
      `;
    }


    function formatCalendarKey(key){

      const [y,m,d] =
        key.split("-").map(Number);

      return new Date(
        y,
        m-1,
        d
      ).toLocaleDateString(
        "de-DE",
        {
          weekday:"long",
          day:"numeric",
          month:"long"
        }
      );
    }


    window.selectCalendarDate =
      function(key){

        selectedDateKey = key;

        const [y,m] =
          key.split("-").map(Number);

        /*
          Keep calendar on selected month.
        */
        calendarCursor =
          new Date(y,m-1,1);

        render();
      };


    window.changeCalendarMonth =
      function(delta){

        calendarCursor =
          new Date(
            calendarCursor.getFullYear(),
            calendarCursor.getMonth()+delta,
            1
          );

        selectedDateKey =
          dateKey(
            calendarCursor.getTime()

        render();
      };

          new Date();

          dateKey(Date.now());

        after last locally seen timestamp.
      */
      const lastSeen =
        Number(
          localStorage.getItem(
            "wg_chat_seen"
          ) || 0

      return S.groupChat.filter(
        msg =>
          Number(msg.time) > lastSeen &&
          Number(msg.user) !== Number(S.mySlot)

    function getPrivateKey(a,b){

        .sort((x,y)=>x-y)

    }

        getPrivateKey(a,b);

      return Array.isArray(
        S.privateChats[key]
      )

    window.sendMessage =
      function(mode){

        const input =
          document.getElementById(
            "chatInput"
          );

        if(!input){
          return;
        }

        const text =
          input.value.trim();

        if(!text){
          return;
        }

        const message = {
          id:
            Date.now()+"_"+Math.random()
              .toString(36)
              .slice(2),

          user:S.mySlot,

          userName:me().name,

          text,

          time:Date.now()
        };


        if(mode === "group"){

          S.groupChat.push(message);

          S.groupChat =
            S.groupChat.slice(-200);

        }else{

          const partner =
            S.activePrivatePartner;

          if(partner === null){
            return;
          }

          const key =
            getPrivateKey(
              S.mySlot,
              partner
            );

          if(!Array.isArray(
            S.privateChats[key]
          )){
            S.privateChats[key] = [];
          }

          S.privateChats[key].push(
            message
          );

          S.privateChats[key] =
            S.privateChats[key]
              .slice(-200);
        }

        saveToCloud();

        render();

        setTimeout(()=>{
          const input =
            document.getElementById(
              "chatInput"
            );

          if(input){
            input.focus();
          }
        },30);
      };

      }

      return `
        <div class="admin-card">

          <div class="admin-title">
            <span style="font-size:23px">⚙️</span>

            <div>
              <strong>Admin</strong>
              <div style="font-size:11px;color:#9f83b8">
                Hassan · WG Verwaltung
              </div>
            </div>
          </div>

          <div style="font-size:12px;color:#a992bb">
            Hier kannst du festlegen, wer bei Müll und Putzen
            <strong>1., 2., 3. und 4.</strong> ist.
          </div>

          ${renderOrderEditor("trash")}

          ${renderOrderEditor("clean")}

        </div>
      `;
    }


    function renderOrderEditor(type){

      const orderKey =
        type === "trash"
          ? "trashOrder"
          : "cleanOrder";

      const posKey =
        type === "trash"
          ? "trashPos"
          : "cleanPos";

      const order =
        S[orderKey];

      const current =
        getCurrent(type);

      return `
        <div class="order-section">

          <h4>
            ${type === "trash" ? "🗑️ Müll-Reihenfolge" : "🧹 Putz-Reihenfolge"}
          </h4>

          ${order.map((id,index)=>{

            const user =
              getUser(id);

            return `
              <div class="order-row">

                <div class="order-position">
                  ${index+1}
                </div>

                <div class="avatar c${user?.colorId || 0}">
                  ${esc(initials(user?.name || "?"))}
                </div>

                <div class="order-name">
                  ${esc(user?.name || "Unbekannt")}
                </div>

                <button
                  class="move-btn"
                  ${index === 0 ? "disabled":""}
                  onclick="moveOrder('${type}',${index},-1)"
                  title="Nach oben"
                >
                  ↑
                </button>

                <button
                  class="move-btn"
                  ${index === order.length-1 ? "disabled":""}
                  onclick="moveOrder('${type}',${index},1)"
                  title="Nach unten"
                >
                  ↓
                </button>

              </div>
            `;

          }).join("")}


          <div class="current-set">
            Jetzt dran:
            <strong>${esc(current.name)}</strong>
          </div>

          <div class="set-current">

            ${order.map(id=>{

              const user =
                getUser(id);

              return `
                <button
                  class="person-chip"
                  onclick="setCurrentTurn('${type}',${id})"
                >
                  ${esc(user.name)}
                </button>
              `;
            }).join("")}

          </div>

        </div>
      `;
    }


    window.moveOrder =
      function(type,index,direction){

        if(!isAdmin()){
          showToast("Nur Hassan kann das ändern.");
          return;
        }

        const orderKey =
          type === "trash"
            ? "trashOrder"
            : "cleanOrder";

        const posKey =
          type === "trash"
            ? "trashPos"
            : "cleanPos";

        const order =
          [...S[orderKey]];

        const newIndex =
          index+direction;

        if(
          newIndex < 0 ||
          newIndex >= order.length
        ){
          return;
        }

        const oldCurrentId =
          order[S[posKey]];

        [
          order[index],
          order[newIndex]
        ] =
        [
          order[newIndex],
          order[index]
        ];

        S[orderKey] = order;

        /*
          Keep the same person as current
          after reordering.
        */
        const newCurrent =
          order.indexOf(oldCurrentId);

        S[posKey] =
          newCurrent >= 0
            ? newCurrent
            : 0;

        logEvent({
          user:S.mySlot,
          userName:me().name,
          action:"admin",
          type,
          text:`Hassan hat die ${typeLabel(type)}-Reihenfolge geändert.`
        });

        saveToCloud();

        render();

        showToast("Reihenfolge gespeichert.");
      };


    window.setCurrentTurn =
      function(type,userId){

        if(!isAdmin()){
          showToast("Nur Hassan kann das ändern.");
          return;
        }

        const orderKey =
          type === "trash"
            ? "trashOrder"
            : "cleanOrder";

        const posKey =
          type === "trash"
            ? "trashPos"
            : "cleanPos";

        const index =
          S[orderKey].indexOf(
            Number(userId)
          );

        if(index === -1){
          return;
        }

        S[posKey] = index;

        const user =
          getUser(userId);

        logEvent({
          user:S.mySlot,
          userName:me().name,
          action:"admin",
          type,
          text:`Hassan hat ${user.name} bei ${typeLabel(type)} auf Position ${index+1} gesetzt.`
        });

        saveToCloud();

        render();

        showToast(
          `${user.name} ist jetzt bei ${typeLabel(type)} dran.`
        );
      };


    /* =========================================================
       NOTIFICATIONS
    ========================================================= */

    window.openNotifications =
      function(){

        const due =
          S.dueTasks || [];

        const recent =
          (S.globalLog || [])
            .slice(0,12);

        document.getElementById(
          "modalRoot"
        ).innerHTML = `
          <div
            class="modal-backdrop"
            onclick="closeModal(event)"
          >
            <div class="modal">

              <div class="modal-handle"></div>

              <div class="modal-head">
                <h3>Benachrichtigungen</h3>

                <button
                  class="close"
                  onclick="closeModal()"
                >
                  ×
                </button>
              </div>

              ${
                due.length
                  ? `
                    <div class="section-title">
                      <h3>Fällig</h3>
                      <span>${due.length}</span>
                    </div>

                    ${due.slice(0,5)
                      .map(renderDueCard)
                      .join("")}
                  `
                  : `
                    <div class="empty" style="padding:25px 10px">
                      <div style="font-size:32px">✨</div>
                      <div style="margin-top:7px">
                        Keine offenen Aufgaben.
                      </div>
                    </div>
                  `
              }

              <div class="section-title">
                <h3>Letzte Aktivitäten</h3>
              </div>

              ${
                recent.length
                  ? recent.slice(0,7)
                    .map(renderLogItem)
                    .join("")
                  : `
                    <div style="color:var(--muted);padding:10px 0">
                      Noch keine Aktivitäten.
                    </div>
                  `
              }

            </div>
          </div>
        `;
      };


    window.closeModal =
      function(event){

        if(
          event &&
          event.target &&
          !event.target.classList.contains(
            "modal-backdrop"
          )
        ){
          return;
        }

        document.getElementById(
          "modalRoot"
        ).innerHTML = "";
      };


    /* =========================================================
       PROFILE
    ========================================================= */

    window.openProfile =
      function(){

        const user = me();

        document.getElementById(
          "modalRoot"
        ).innerHTML = `
          <div
            class="modal-backdrop"
            onclick="closeModal(event)"
          >

            <div class="modal">

              <div class="modal-handle"></div>

              <div class="modal-head">

                <h3>Profil</h3>

                <button
                  class="close"
                  onclick="closeModal()"
                >
                  ×
                </button>

              </div>

              <div style="
                display:flex;
                align-items:center;
                gap:13px;
                padding:8px 0 20px;
              ">

                <div class="avatar c${user.colorId}"
                     style="width:58px;height:58px;font-size:18px">
                  ${esc(initials(user.name))}
                </div>

                <div>
                  <strong style="font-size:18px">
                    ${esc(user.name)}
                  </strong>

                  <div style="
                    color:var(--muted);
                    font-size:12px;
                    margin-top:4px;
                  ">
                    ${
                      user.isAdmin
                        ? "Admin"
                        : "WG Mitglied"
                    }
                  </div>
                </div>

              </div>

              <button
                class="action"
                style="width:100%;margin-bottom:8px"
                onclick="closeModal();setTab('calendar')"
              >
                📅 Kalender öffnen
              </button>

              ${
                user.isAdmin
                  ? `
                    <button
                      class="action"
                      style="width:100%;margin-bottom:8px"
                      onclick="closeModal();setTab('home')"
                    >
                      ⚙️ Admin öffnen
                    </button>
                  `
                  : ""
              }

              <button
                class="action"
                style="
                  width:100%;
                  color:#ff6f69;
                  border-color:rgba(255,69,58,.18);
                "
                onclick="closeModal();logout()"
              >
                ⇥ Ausloggen
              </button>

            </div>

          </div>
        `;
      };


    /* =========================================================
       SWIPE
    ========================================================= */

    const swipeData = {};

    window.swipeStart =
      function(event,type){

        const touch =
          event.touches[0];

        swipeData[type] = {
          startX:touch.clientX,
          currentX:touch.clientX
        };

        event.currentTarget.classList.add(
          "swiping"
        );
      };


    window.swipeMove =
      function(event,type){

        if(!swipeData[type]){
          return;
        }

        const touch =
          event.touches[0];

        const delta =
          touch.clientX -
          swipeData[type].startX;

        swipeData[type].currentX =
          touch.clientX;

        if(delta < 0){
          event.currentTarget.style.transform =
            `translateX(${Math.max(delta,-120)}px)`;
        }
      };


    window.swipeEnd =
      function(event,type){

        const data =
          swipeData[type];

        if(!data){
          return;
        }

        const delta =
          data.currentX -
          data.startX;

        event.currentTarget.classList.remove(
          "swiping"
        );

        event.currentTarget.style.transform = "";

        delete swipeData[type];

        if(delta < -80){
          skipTurn(type);
        }
      };


    /* =========================================================
       RENDER
    ========================================================= */

    function render(){

      const login =
        document.getElementById(
          "loginScreen"
        );

      const app =
        document.getElementById(
          "app"
        );

      if(!S.isLoggedIn){

        login.classList.remove(
          "hidden"
        );

        app.classList.add(
          "hidden"
        );

        renderLogin();

        return;
      }

      login.classList.add(
        "hidden"
      );

      app.classList.remove(
        "hidden"
      );

      const avatar =
        document.getElementById(
          "topAvatar"
        );

      const user =
        me();

      avatar.innerHTML = `
        <span class="avatar small c${user.colorId}">
          ${esc(initials(user.name))}
        </span>
      `;

      document.getElementById(
        "topSub"
      ).textContent =
        user.isAdmin
          ? "Hassan · Admin"
          : "WG Übersicht";

      let html = "";

      switch(S.tab){

        case "due":
          html = renderDue();
          break;

        case "calendar":
          html = renderCalendar();
          break;

        case "chat":
          html = renderChat();
          break;

        case "log":
          html = renderLog();
          break;

        default:
          html = renderHome();
      }

      document.getElementById(
        "content"
      ).innerHTML = html;

      updateNav();
    }


    /* =========================================================
       INITIAL START
    ========================================================= */

    restoreLogin();

    render();

    window.addEventListener(
      "focus",
      ()=>{
        render();
      }
    );

  </script>
</body>
</html>
