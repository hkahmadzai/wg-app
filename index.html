<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #f5f5f3;
  min-height: 100dvh;
  color: #1a1a1a;
}

.app {
  width: 100%;
  max-width: 420px;
  margin: 0 auto;
  padding: 0 0 90px;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
}

/* LOGIN */
.login-screen {
  position: fixed;
  inset: 0;
  background: #3A8AE0;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 30px;
}

.login-card {
  background: white;
  padding: 32px 28px;
  border-radius: 24px;
  width: 100%;
  max-width: 360px;
  box-shadow: 0 20px 60px rgba(0,0,0,.15);
  text-align: center;
}

.login-card h2 {
  margin-bottom: 4px;
  font-size: 26px;
  font-weight: 900;
  letter-spacing: 2px;
  color: #3A8AE0;
  cursor: pointer;
  user-select: none;
}

.login-card p {
  font-size: 13px;
  color: #999;
  margin-bottom: 22px;
}

.login-card input {
  width: 100%;
  padding: 13px 16px;
  border: 1.5px solid #e8e8e6;
  border-radius: 12px;
  margin-bottom: 10px;
  font-size: 15px;
  outline: none;
}

.login-card input:focus {
  border-color: #3A8AE0;
}

.login-card button {
  width: 100%;
  padding: 14px;
  background: #3A8AE0;
  color: white;
  border: none;
  border-radius: 14px;
  font-weight: 800;
  font-size: 16px;
  cursor: pointer;
}

/* HERO */
.hero-banner {
  background: linear-gradient(135deg, #3A8AE0 0%, #2570c8 100%);
  padding: max(56px, env(safe-area-inset-top)) 24px 22px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-radius: 0 0 28px 28px;
  margin-bottom: 14px;
}

.hero-title {
  color: white;
  font-size: 28px;
  font-weight: 900;
  letter-spacing: 3px;
}

/* CARDS */
.card {
  background: #fff;
  border-radius: 20px;
  margin: 0 16px 14px;
  padding: 20px;
  position: relative;
}

.slabel {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .09em;
  text-transform: uppercase;
  color: #bbb;
  margin-bottom: 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

/* PROFILE */
.profile-banner {
  display: flex;
  align-items: flex-start;
  gap: 12px;
}

.profile-avatar {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-size: 17px;
  font-weight: 800;
  text-transform: uppercase;
  flex-shrink: 0;
  margin-top: 2px;
}

.profile-right {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.profile-right input {
  width: 100%;
  border: 1.5px solid #eee;
  padding: 9px 13px;
  border-radius: 10px;
  font-size: 15px;
  font-weight: 600;
  outline: none;
  background: #fafafa;
}

.profile-right input:focus {
  border-color: #3A8AE0;
  background: white;
}

.profile-tasks {
  margin-top: 4px;
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.task-pill-due {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 12px;
  font-weight: 600;
  color: #E05A3A;
  background: #FDEEE9;
  padding: 4px 10px;
  border-radius: 20px;
  width: fit-content;
}

.task-pill-done {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 12px;
  font-weight: 500;
  color: #3AAE60;
  background: #E8F7EE;
  padding: 4px 10px;
  border-radius: 20px;
  width: fit-content;
}

.task-pill-done .done-time {
  font-size: 10px;
  color: #aaa;
  font-weight: 400;
}

/* COLOR PICKER */
.color-picker {
  display: flex;
  gap: 8px;
  margin-top: 4px;
  align-items: center;
}

.color-picker-label {
  font-size: 11px;
  color: #aaa;
  font-weight: 600;
  text-transform: uppercase;
}

.color-opt {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  border: 2px solid transparent;
  cursor: pointer;
  transition: transform .1s;
}

.color-opt.selected {
  border-color: #1a1a1a;
  transform: scale(1.15);
}

/* ROTATION */
.dots-mini {
  display: flex;
  gap: 10px;
  align-items: flex-end;
}

.dot-mini {
  border-radius: 50%;
  opacity: .22;
  transition: all .3s cubic-bezier(.34,1.4,.64,1);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 11px;
  font-weight: 800;
  position: relative;
  text-transform: uppercase;
}

.dot-mini.active {
  opacity: 1;
  transform: scale(1.05);
}

.dot-name-tag {
  font-size: 10px;
  position: absolute;
  bottom: -20px;
  white-space: nowrap;
  color: #999;
  font-weight: 500;
  text-transform: none;
}

.turn-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 28px;
}

.turn-label {
  font-size: 15px;
  font-weight: 700;
}

.action-header-btn {
  font-size: 11px;
  font-weight: bold;
  color: #3A8AE0;
  text-transform: uppercase;
  background: none;
  border: none;
  cursor: pointer;
}

/* NEXT STRIP */
.next-strip {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 14px;
  padding: 8px 12px;
  background: #f9f9f7;
  border-radius: 10px;
}

.next-strip-lbl {
  font-size: 10px;
  font-weight: 700;
  color: #ccc;
  letter-spacing: .06em;
  text-transform: uppercase;
  margin-right: 2px;
  flex-shrink: 0;
}

.next-person {
  display: flex;
  align-items: center;
  gap: 4px;
}

.next-dot {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-size: 8px;
  font-weight: 800;
  text-transform: uppercase;
}

.next-person .next-name {
  font-size: 11px;
  font-weight: 600;
}

.next-arrow {
  color: #ddd;
  font-size: 10px;
}

/* CHECKLIST */
.items {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 18px;
  margin-top: 12px;
}

.item {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 16px;
  border-radius: 14px;
  border: 2px solid transparent;
  background: #f9f9f7;
  cursor: pointer;
  transition: all .15s;
  user-select: none;
}

.item.checked {
  border-color: var(--c);
  background: var(--cl);
}

.item:active {
  transform: scale(.98);
}

.item-icon {
  font-size: 20px;
  width: 26px;
  text-align: center;
}

.item-name {
  flex: 1;
  font-size: 15px;
  font-weight: 500;
}

.item-check {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  border: 2px solid #ddd;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all .15s;
  flex-shrink: 0;
}

.item.checked .item-check {
  border-color: var(--c);
  background: var(--c);
}

.chk {
  display: none;
}

.item.checked .chk {
  display: block;
}

/* BUTTONS */
.btn {
  width: 100%;
  padding: 15px;
  border: none;
  border-radius: 14px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: opacity .15s, transform .1s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.btn:active {
  transform: scale(.97);
  opacity: .85;
}

.btn:disabled {
  background: #e8e8e6 !important;
  color: #bbb !important;
  cursor: not-allowed;
  transform: none;
}

/* CLEAN */
.clean-btn {
  width: 100%;
  border: none;
  border-radius: 18px;
  cursor: pointer;
  padding: 20px 22px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  transition: transform .15s, box-shadow .15s;
  position: relative;
  overflow: hidden;
}

.clean-btn:active {
  transform: scale(.97);
}

.clean-btn::before {
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.18) 0%,rgba(255,255,255,0) 60%);
  pointer-events:none;
}

.clean-btn-left {
  text-align:left;
}

.clean-btn-sup {
  font-size:11px;
  font-weight:700;
  letter-spacing:.08em;
  text-transform:uppercase;
  opacity:.75;
  margin-bottom:4px;
}

.clean-btn-main {
  font-size:17px;
  font-weight:800;
  letter-spacing:-.2px;
}

.clean-btn-icon {
  font-size:32px;
}

/* WEEK */
.week-schedule {
  display:flex;
  gap:6px;
  margin-top:12px;
  margin-bottom:0;
  overflow-x:auto;
  padding-bottom:2px;
}

.week-pill {
  flex-shrink:0;
  display:flex;
  align-items:center;
  gap:6px;
  padding:6px 12px;
  border-radius:20px;
  font-size:12px;
  font-weight:600;
}

/* EXTRA */
.custom-task-box {
  display:flex;
  gap:8px;
  margin-top:4px;
}

.custom-task-box input {
  flex:1;
  border:1.5px solid #eee;
  background:#f9f9f7;
  padding:12px;
  border-radius:12px;
  font-size:14px;
  outline:none;
}

.custom-task-box input:focus {
  border-color:#3A8AE0;
  background:white;
}

.custom-task-box button {
  background:#1a1a1a;
  color:white;
  border:none;
  padding:0 16px;
  border-radius:12px;
  font-weight:bold;
  font-size:13px;
  cursor:pointer;
}

/* LOG */
.log-item {
  display:flex;
  align-items:flex-start;
  gap:12px;
  padding:12px 0;
  border-bottom:1px solid #f5f5f3;
}

.log-item:last-child {
  border-bottom:none;
}

.log-dot {
  width:32px;
  height:32px;
  border-radius:50%;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-size:13px;
  font-weight:bold;
  text-transform:uppercase;
}

.log-who {
  font-size:14px;
  font-weight:700;
  margin-bottom:2px;
}

.log-text {
  font-size:13px;
  color:#444;
}

.log-tags {
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  margin-top:4px;
  margin-bottom:2px;
}

.log-tag {
  font-size:11px;
  padding:2px 8px;
  border-radius:20px;
  font-weight:500;
}

.log-time {
  font-size:10px;
  color:#ccc;
  margin-top:2px;
}

.log-empty {
  text-align:center;
  color:#ccc;
  font-size:14px;
  padding:32px 0;
}

/* DUE */
.due-card {
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px;
  border-radius:14px;

.due-avatar {

  height:38px;
  border-radius:50%;

  align-items:center;
  justify-content:center;

  flex-shrink:0;
}

.due-info {

}

.due-name {
  font-size:14px;
  font-weight:800;
}

.due-task {
  font-size:12px;

}

.due-done {

  background:#fff;
  color:#E05A3A;
  border-radius:10px;
  padding:8px 10px;
  font-size:10px;
  font-weight:800;
  cursor:pointer;
}

/* CHAT */
.chat-tab-header {
  display:flex;
  background:white;
  margin:0 16px 12px;
  border-radius:14px;
  padding:4px;
  gap:4px;
}

.chat-tab-btn {
  flex:1;
  padding:9px;
  border:none;
  background:none;
  border-radius:10px;
  font-size:13px;
  font-weight:700;
  color:#bbb;

}

.chat-tab-btn.active {
  background:#3A8AE0;
  color:white;
}

.chat-layout {
  display:flex;
  flex-direction:column;
  height:calc(100dvh - 230px);
  margin:0 16px;
}

.chat-pane {
  display:flex;
  flex-direction:column;
  background:white;
  border-radius:20px;

}

.chat-pane-header {
  display:flex;
  align-items:center;
  gap:10px;
  padding:13px 16px;
  border-bottom:1px solid #f0f0ee;
  background:#fafafa;
  font-weight:700;
  font-size:14px;
}

.chat-messages {
  flex:1;
  padding:14px;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:8px;
}

.msg-bubble {
  max-width:75%;
  padding:10px 14px;
  border-radius:16px;
  font-size:14px;
  line-height:1.4;
}

.msg-author {
  font-size:10px;

  opacity:.8;
}

.msg-bubble.me {
  align-self:flex-end;
  background:#3A8AE0;
  color:white;
  border-bottom-right-radius:4px;
}

.msg-bubble.them {
  align-self:flex-start;
  background:#f0f0ee;
  color:#1a1a1a;
  border-bottom-left-radius:4px;
}

.sys-msg {
  align-self:center;
  background:#fff;
  font-size:11px;
  padding:5px 12px;
  border-radius:12px;
  color:#888;
  border:1px solid #eee;
  text-align:center;
  max-width:85%;
}

.chat-input-area {
  display:flex;
  padding:10px 12px 12px;
  border-top:1px solid #f0f0ee;
  gap:8px;
  background:white;
}

.chat-input-area input {
  flex:1;
  border:1.5px solid #e8e8e6;
  padding:10px 14px;
  border-radius:20px;
  font-size:14px;
  outline:none;
  background:#fafafa;
}

.chat-input-area button {
  background:#3A8AE0;
  color:white;
  border:none;
  padding:0 18px;
  border-radius:20px;
  font-weight:700;

}

.chat-rooms {
  display:flex;
  flex-direction:column;
  gap:8px;
  overflow-y:auto;
}

.chat-room-row {
  display:flex;
  align-items:center;
  gap:14px;
  background:white;
  padding:14px 16px;
  border-radius:16px;
  cursor:pointer;

/* BOTTOM NAV */
.bottom-nav {
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:100%;
  max-width:420px;
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(16px);
  border-top:1px solid #eee;
  display:flex;
  padding:8px 0 max(16px,env(safe-area-inset-bottom));
  z-index:100;
}

.nav-tab {
  flex:1;
  background:none;
  border:none;
  cursor:pointer;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
  padding:5px 0;
}

.nav-tab svg {
  width:22px;
  height:22px;
}

.nav-tab span {
  font-size:10px;
  font-weight:600;
}
</style>
</head>

/* COLORS */

const COLORS = [
  { hex:"#E05A3A", light:"#FDEEE9" },
  { hex:"#3A8AE0", light:"#E8F2FD" },
  { hex:"#3AAE60", light:"#E8F7EE" },

];


/* BINS */

const BINS = [

/* STATE */

let S = {

  trashTurn:0,
  cleanTurn:0,

  dueTasks:[],

  globalLog:[],

  users:[
    {id:0, name:"Jacky", deviceId:"", colorId:0},
    {id:1, name:"Hassan", deviceId:"", colorId:1},
    {id:2, name:"Suraj", deviceId:"", colorId:2},

};


let localTrashChecked = [];


/* DEVICE TOKEN */

let myLocalDeviceToken =
  localStorage.getItem("wg_device_secure_token");

if (!myLocalDeviceToken) {

  myLocalDeviceToken =
    "dev_" +
    Math.random().toString(36).substr(2,9) +
    Date.now();

  localStorage.setItem(
    "wg_device_secure_token",
    myLocalDeviceToken
  );
}


/* LOGIN */

if (
  localStorage.getItem("wg_secure_logged_in") === "true"
) {

  S.isLoggedIn = true;

  S.mySlot = parseInt(
    localStorage.getItem("wg_user_slot") || "0",
    10
  );

  initOneSignalNotifications();

} else {

  document.getElementById("loginGate").style.display = "flex";
}


/* ONESIGNAL */

function initOneSignalNotifications() {

  window.OneSignalDeferred =
    window.OneSignalDeferred || [];

  OneSignalDeferred.push(async function(OneSignal) {

    try {

      await OneSignal.init({
        appId: ONESIGNAL_APP_ID,
        allowLocalhostAsSecureOrigin:true
      });

      await OneSignal.login(
        "user_" + S.mySlot
      );

    } catch(e) {

      console.warn(
        "OneSignal unavailable:",
        e
      );

    }

  });
}


/* PUSH */

function sendPushToUser(
  targetSlotId,
  alertTitle,
  alertMessage,
  isSilent=false
) {

  fetch("/api/send-push", {

    method:"POST",

    headers:{
      "Content-Type":"application/json"
    },

    body:JSON.stringify({
      targetSlotId,
      alertTitle,
      alertMessage,
      isSilent
    })

  })

  .then(res => {

    if (!res.ok)
      throw new Error("Push API unavailable");

    return res.json();

  })

  .then(data => {

    console.log(
      "Push Notification Status:",
      data
    );

  })

  .catch(e => {

    console.warn(
      "Push notification unavailable:",
      e.message
    );

  });
}

window.triggerSecretReset = function() {

      },

      {

/* LOGIN */

window.submitSecureLogin = function() {

  const code =
    document.getElementById("passcodeInput")
      .value
      .trim();

  const rawName =
    document.getElementById("nameInput")
      .value
      .trim();

  if (!rawName) {

    alert("Bitte gib deinen Namen ein!");
    return;

  }

  if (code !== WG_PASSCODE) {

    alert("Falscher WG-Passcode!");
    return;

  }

  const cleanName =
    rawName.toLowerCase();

  let foundSlot = -1;
  let emptySlot = -1;

  for (
    let i=0;
    i<S.users.length;
    i++
  ) {

    if (
      S.users[i].name.toLowerCase()
      === cleanName
    ) {

      foundSlot = i;
      break;

    }

    if (
      !S.users[i].deviceId &&
      emptySlot === -1
    ) {

      emptySlot = i;

    }

  }

  if (foundSlot !== -1) {

    if (
      !S.users[foundSlot].deviceId ||
      S.users[foundSlot].deviceId
      === myLocalDeviceToken
    ) {

      S.users[foundSlot].deviceId =
        myLocalDeviceToken;

      executeLoginSuccess(foundSlot);

    } else {

      alert(
        "Dieser Name ist auf einem anderen Gerät registriert!"
      );

    }

  } else {

    if (emptySlot !== -1) {

      S.users[emptySlot].name =
        rawName;

      S.users[emptySlot].deviceId =
        myLocalDeviceToken;

      executeLoginSuccess(emptySlot);

    } else {

      alert(
        "Alle 4 Profile belegt!"
      );

    }

  }

};


function executeLoginSuccess(slot) {

  localStorage.setItem(
    "wg_secure_logged_in",
    "true"
  );

  localStorage.setItem(
    "wg_user_slot",
    slot
  );

  S.isLoggedIn = true;
  S.mySlot = slot;

  document.getElementById(
    "loginGate"
  ).style.display = "none";

  initOneSignalNotifications();

  saveToCloud();

  render();

}


/* FIREBASE SYNC */

onValue(
  ref(db,"wg_secure_v6"),
  snapshot => {

    const data = snapshot.val();

    if (data) {

      S.trashTurn =
        data.trashTurn ?? 0;

      S.cleanTurn =
        data.cleanTurn ?? 0;

      S.dueTasks =
        data.dueTasks || [];

      S.globalLog =
        data.globalLog || [];

      S.users =
        data.users || S.users;

      S.groupChat =
        data.groupChat || [];

      S.privateChats =
        data.privateChats || {};

      if (
        S.mySlot >= S.users.length
      ) {

        S.mySlot = 0;

      }

      render();

    } else {

      saveToCloud();

    }

  }
);


/* SAVE */

function saveToCloud() {

  set(
    ref(db,"wg_secure_v6"),
    {

      trashTurn:S.trashTurn,

      cleanTurn:S.cleanTurn,

      dueTasks:S.dueTasks,

      globalLog:S.globalLog,

      users:S.users,

      groupChat:S.groupChat,

      privateChats:S.privateChats

    }
  )
  .catch(e => {

    console.error(
      "Firebase save failed:",

    );

  });

}

/* SKIP / BOUNCE */

window.skipTurn = type => {

  const turnKey =
    type + "Turn";

  const skippedId =
    S[turnKey];

  const skippedUser =
    S.users[skippedId];

  if (!skippedUser) return;

  if (!S.dueTasks)
    S.dueTasks = [];


  const alreadyDue =
    S.dueTasks.some(
      d =>
        d.user === skippedId &&
        d.type === type
    );


  if (!alreadyDue) {

    S.dueTasks.push({

      user:skippedId,

      type:type,

      time:Date.now()

    });

  }


  S[turnKey] =
    (S[turnKey] + 1)
    % S.users.length;


  saveToCloud();

  render();


  const nextUser =
    S.users[S[turnKey]];

  const typeLabel =
    type === "trash"
      ? "Müll 🗑️"
      : "Putzen 🧹";


  sendPushToUser(

    nextUser.id,

    "Du bist jetzt dran!",

    `${skippedUser.name} hat gepasst. ${typeLabel}`

  );

};

/* CHAT */

window.sendMsg = function(mode) {

  const inp =
    document.getElementById(
      "msgInp"
    );

  if (
    !inp ||
    !inp.value.trim()
  )
    return;


  const text =
    inp.value.trim();

  const me =
    S.users[S.mySlot];


  if (mode === "group") {

    S.groupChat.push({

      sender:S.mySlot,

      authorName:me.name,

      text:text,

      ts:Date.now()

    });


    S.users.forEach(u => {

      if (
        u.id !== S.mySlot
      ) {

        sendPushToUser(

          u.id,

          `💬 WG-Chat (${me.name})`,

          text

        );

      }

    });


  } else {

    if (
      S.activePrivatePartner === null
    )
      return;


    const key =
      `${Math.min(
        S.mySlot,
        S.activePrivatePartner
      )}-${Math.max(
        S.mySlot,
        S.activePrivatePartner
      )}`;


    if (!S.privateChats[key])
      S.privateChats[key] = [];


    S.privateChats[key].push({

      sender:S.mySlot,

      text:text,

      ts:Date.now()

    });


    sendPushToUser(

      S.activePrivatePartner,

      `🔒 Private Nachricht von ${me.name}`,

      text

    );

  }


  inp.value = "";

  saveToCloud();

  render();

  scrollChat();

};

  const u =

/* NEXT STRIP */

function nextStrip(currentTurn) {

  const count =
    S.users.length;


  if (count <= 1)
    return "";


  const amount =
    Math.min(3,count-1);


  return `

    <div class="next-strip">

      <span class="next-strip-lbl">
        Danach
      </span>

      ${[1,2,3]
        .slice(0,amount)
        .map(i => {

          const idx =
            (currentTurn + i)
            % count;

          const u =
            S.users[idx];

          const col =
            COLORS[
              u.colorId ?? idx
            ];

          const opacity =
            i === 1
              ? 1
              : i === 2
                ? .55
                : .3;


          return `

            <div
              class="next-person"
              style="opacity:${opacity}"
            >

              <div
                class="next-dot"
                style="background:${col.hex}"
              >
                ${getInitials(u.name)}
              </div>

              <span
                class="next-name"
                style="color:${col.hex}"
              >
                ${u.name}
              </span>

            </div>

            ${
              i < amount
                ? '<span class="next-arrow">›</span>'
                : ''
            }

          `;

        })
        .join("")}

    </div>

  `;

}


/* WEEK SCHEDULE */

function weekSchedule(cleanTurn) {

  return `

    <div class="week-schedule">

      ${[0,1,2,3]
        .map(i => {

          const idx =
            (cleanTurn + i)
            % S.users.length;

          const u =

          const col =
            COLORS[
              u.colorId ?? idx
            ];

          const isCur =
            i === 0;


          return `

            <div
              class="week-pill"
              style="
                background:${isCur
                  ? col.hex
                  : col.light};
                color:${isCur
                  ? "white"
                  : col.hex};

            >

              <span
                style="
                  opacity:${isCur?".75":".7"};
                  font-size:10px;
                  font-weight:${isCur?700:600}

                  i === 0
                    ? "Diese Woche"

        >
          Eintragen
        </button>

      </div>

    </div>

  `;

}


/* DUE */

if (S.tab === "due") {

  const due =
    S.dueTasks || [];


  html = `

    <div class="hero-banner">

      <div>
        <div class="hero-title">
          DUE
        </div>
      </div>

      <div style="font-size:28px;">
        ⚠️
      </div>

    </div>


    <div class="card">

      <div class="slabel">

        <span>
          📌 Noch offen
        </span>

        <span>
          ${due.length}
        </span>

      </div>


      ${
        due.length === 0

          ? `
            <div class="log-empty">
              🎉 Alles erledigt!
            </div>
          `

          : due.map(
              (d,index) => {

                const u =
                  S.users[d.user];

                if (!u)
                  return "";

                const c =
                  COLORS[
                    u.colorId ?? u.id
                  ];

                const label =
                  d.type === "trash"
                    ? "🗑️ Müll"
                    : "🧹 Reinigung";


                return `

                  <div class="due-card">

                    <div
                      class="due-avatar"
                      style="
                        background:${c.hex}
                      "
                    >
                      ${getInitials(u.name)}
                    </div>


                    <div class="due-info">

                      <div
                        class="due-name"
                        style="color:${c.hex}"
                      >
                        ${u.name}
                      </div>

                      <div class="due-task">
                        ${label} noch offen
                      </div>

                    </div>


                    <button
                      class="due-done"
                      onclick="clearDue(${index})"
                    >
                      ERLEDIGT
                    </button>

                  </div>

                `;

              }
            ).join("")
      }

    </div>

  `;

}


/* CHAT */

if (S.tab === "chat") {

  let inner = "";


  if (
    S.chatSubTab === "group"
  ) {

    inner = `

      <div class="chat-pane">

        <div class="chat-pane-header">
          💬 WG Allgemeiner Chat
        </div>


        <div
          class="chat-messages"
          id="cBox"
        >

          ${S.groupChat
            .map(m =>

              m.sender === -1

                ? `
                  <div class="sys-msg">
                    ${m.text}
                  </div>
                `

                : `
                  <div
                    class="
                      msg-bubble
                      ${
                        m.sender === S.mySlot
                          ? "me"
                          : "them"
                      }
                    "
                  >

                    <div
                      class="msg-author"
                      style="
                        color:${
                          m.sender === S.mySlot

                            ? "rgba(255,255,255,.7)"

                            : (
                              COLORS[
                                S.users[
                                  m.sender
                                ].colorId
                                ??
                                m.sender
                              ].hex
                            )
                        }
                      "
                    >
                      ${m.authorName}
                    </div>

                    ${m.text}

                  </div>
                `

            )
            .join("")}

        </div>


        <div class="chat-input-area">

          <input
            type="text"
            id="msgInp"
            placeholder="Nachricht an alle…"
            onkeydown="
              if(event.key==='Enter')
                sendMsg('group')
            "
          >

          <button
            onclick="sendMsg('group')"
          >
            Senden
          </button>

        </div>

      </div>

    `;

  } else {


    if (
      S.activePrivatePartner !== null
    ) {

      const partner =
        S.users[
          S.activePrivatePartner
        ];


      const key =
        `${Math.min(
          S.mySlot,
          S.activePrivatePartner
        )}-${Math.max(
          S.mySlot,
          S.activePrivatePartner
        )}`;


      const history =
        S.privateChats[key] || [];


      inner = `

        <div class="chat-pane">

          <div class="chat-pane-header">

            <button
              class="action-header-btn"
              onclick="openPrivateWith(null)"
            >
              ⬅ Zurück
            </button>

            🔒 Chat mit ${partner.name}

          </div>


          <div
            class="chat-messages"
            id="cBox"
          >

            ${history
              .map(
                m => `

                  <div
                    class="
                      msg-bubble
                      ${
                        m.sender === S.mySlot
                          ? "me"
                          : "them"
                      }
                    "
                  >
                    ${m.text}
                  </div>

                `
              )
              .join("")}

          </div>


          <div class="chat-input-area">

            <input
              type="text"
              id="msgInp"
              placeholder="Private Nachricht…"
              onkeydown="
                if(event.key==='Enter')
                  sendMsg('private')
              "
            >

            <button
              onclick="sendMsg('private')"
            >
              Senden
            </button>

          </div>

        </div>

      `;

    } else {

      inner = `

        <div class="chat-rooms">

          <p
            style="
              font-size:11px;
              font-weight:700;
              color:#bbb;
              text-transform:uppercase;
              margin:0 0 4px
            "
          >
            🔒 Private 1:1 Chats
          </p>


          ${S.users
            .filter(
              u =>
                u.id !== S.mySlot
            )
            .map(u => {

              const c =
                COLORS[
                  u.colorId ?? u.id
                ];


              return `

                <div
                  class="chat-room-row"
                  onclick="
                    openPrivateWith(${u.id})
                  "
                >

                  <div
                    style="
                      background:${c.hex};
                      width:40px;
                      height:40px;
                      border-radius:50%;
                      display:flex;
                      align-items:center;
                      justify-content:center;
                      color:white;
                      font-size:15px;
                      font-weight:800;
                      flex-shrink:0
                    "
                  >
                    ${getInitials(u.name)}
                  </div>


                  <div>

                    <div
                      style="
                        font-weight:700;
                        font-size:15px
                      "
                    >
                      ${u.name}
                    </div>

                    <div
                      style="
                        font-size:11px;
                        color:#aaa
                      "
                    >
                      Privater Chat · nur für euch
                    </div>

                  </div>

                </div>

              `;

            })
            .join("")}

        </div>

      `;

    }

  }


  html = `

    <div class="hero-banner">

      <div>
        <div class="hero-title">
          KINGEN WG
        </div>
      </div>

    </div>


    <div class="chat-tab-header">

      <button
        class="
          chat-tab-btn
          ${
            S.chatSubTab === "group"
              ? "active"
              : ""
          }
        "
        onclick="
          setChatSubTab('group')
        "
      >
        Allgemein
      </button>


      <button
        class="
          chat-tab-btn
          ${
            S.chatSubTab === "private"
              ? "active"
              : ""
          }
        "
        onclick="
          setChatSubTab('private')
        "
      >
        Privat 🔒
      </button>

    </div>


    <div class="chat-layout">

      ${inner}

    </div>

  `;

}


/* LOG */

if (S.tab === "log") {

  html = `

    <div class="hero-banner">

      <div>
        <div class="hero-title">
          KINGEN WG
        </div>
      </div>

    </div>


    <div class="card">

      <div class="slabel">
        📜 Aktivitäts-Log
      </div>


      ${
        S.globalLog.length === 0

          ? `
            <div class="log-empty">
              Noch keine Einträge.
            </div>
          `

          : S.globalLog
              .map(l => {

                const u =
                  S.users[l.person];

                if (!u)
                  return "";

                const c =
                  COLORS[
                    u.colorId ?? l.person
                  ];


                const tags =
                  (l.items || [])
                    .map(bId => {

                      const bin =
                        BINS.find(
                          bx =>
                            bx.id === bId
                        );

                      return bin

                        ? `
                          <span
                            class="log-tag"
                            style="
                              background:${c.light};
                              color:${c.hex}
                            "
                          >
                            ${bin.icon}
                            ${bin.name}
                          </span>
                        `

                        : "";

                    })
                    .join("");


                return `

                  <div class="log-item">

                    <div
                      class="log-dot"
                      style="
                        background:${c.hex}
                      "
                    >
                      ${getInitials(u.name)}
                    </div>


                    <div>

                      <div
                        class="log-who"
                        style="
                          color:${c.hex}
                        "
                      >
                        ${u.name}
                      </div>


                      <div class="log-text">
                        ${l.text}
                      </div>


                      ${
                        tags

                          ? `
                            <div class="log-tags">
                              ${tags}
                            </div>
                          `

                          : ""
                      }


                      <div class="log-time">
                        ${fmtTs(l.ts)}
                      </div>

                    </div>

                  </div>

                `;

              })
              .join("")
      }

    </div>

  `;

}

    <!-- LOG -->

    <button

      <svg

          S.tab === "log"
            ? ac

        }"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >

        <path

      </svg>


      <span
        style="
          color:${
            S.tab === "log"
              ? ac
              : "#bbb"
          }
        "
      >
        Verlauf
      </span>

    </button>


  </nav>

  `

);

}
